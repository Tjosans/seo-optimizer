- id: "6.1"
  phase: 6
  phaseLabel: "6 — First 30 days"
  priority: P1
  profile: core
  launchGate: false
  applicability:
    universal: true
    any: []
    source: >-
      All sites
  task: >-
    Indexation review
  whatToDo: >-
    Compare submitted, crawled, canonical and indexed URLs by template; inspect priority pages and assign causes/owners for exclusions. For Google indexed URL Inspection, compare selected and declared canonicals against the approved matrix, recording indexed-data time, current live evidence and whether the report predates release. Investigate material mismatches without treating intentional consolidation as failure. Where Bing is selected, review its sitemap processing and crawl/index issues in the first week and first month with engine-specific evidence.
  doneWhen: >-
    Known blockers and material canonical/indexing mismatches have investigation, fix and retest owners. Review available indexed evidence; record missing or lagging data as Unavailable with the next check date, separately for each engine. Do not invent an indexed result or treat this follow-up as a retrospective day-one indexing prerequisite.
  owners: ["seo"]
  ownerSource: >-
    SEO
  tools: >-
    Search Console indexed/live URL Inspection; Bing tools where selected; URL matrix
  cadence:
    triggers: []
    interval: weekly
    windowDays: 30
    source: >-
      Weekly for 30 days
  notes: >-
    Purpose: indexing/discovery; measurement. D05 follow-up: in the first week, review unobserved crawler cases from 5.1 using correctly verified request logs and available search-tool evidence. Record the crawler category, URL/time/status, method and any access failure; if still unobserved, keep that evidence Unavailable with an owner and next date. A live user-triggered fetch is not proof of a normal indexing crawl. Source: Verify Google crawler requests. Source IDs: SRC010; SRC019; SRC091.
  automation: assisted
  remediationClass: config
  detectors: ["indexation-review"]
  sources:
    - id: "SRC010"
      topic: "Canonicalization"
      url: "https://developers.google.com/search/docs/crawling-indexing/consolidate-duplicate-urls"
      usedFor: >-
        1.3, 1.6, 1.16: retained duplicates, preferred-URL signals, supported non-HTML Link canonical; selection is not guaranteed.
      verified: "2026-09-08"
    - id: "SRC019"
      topic: "URL Inspection: live vs indexed"
      url: "https://support.google.com/webmasters/answer/9012289?hl=en"
      usedFor: >-
        B04: live evidence cannot establish Google-selected canonical
      verified: "2026-09-07"
    - id: "SRC091"
      topic: "Bing sitemap guidance"
      url: "https://blogs.bing.com/webmaster/July-2025/Keeping-Content-Discoverable-with-Sitemaps-in-AI-Powered-Search"
      usedFor: >-
        5.8/6.1: selected Bing sitemap discovery/processing follow-up; submission, crawl and indexing are distinct stages and no display guarantee follows.
      verified: "2026-09-09"
- id: "6.2"
  phase: 6
  phaseLabel: "6 — First 30 days"
  priority: P1
  profile: extended
  launchGate: false
  applicability:
    universal: true
    any: []
    source: >-
      All sites
  task: >-
    Field performance and real-user monitoring
  whatToDo: >-
    Review available field LCP, INP and CLS at p75, separating mobile and desktop. Name the source and actual URL, origin, Search Console group or first-party RUM cohort; do not present one as another. Record the collection window, sample/coverage limits and release timing. Good boundaries are LCP <=2.5 s, INP <=200 ms and CLS <=0.1. Use lab and relevant RUM evidence to diagnose regressions and assign actions.
  doneWhen: >-
    Available metrics have a named population/window/device segment and correct grade. Missing or insufficient metrics are Unavailable in evidence with an owner and next review, not Passed or Failed. Regressions have impact, action owners and retest dates. Completing this review does not claim that the site has Good field CWV.
  owners: ["developer"]
  ownerSource: >-
    Developer
  tools: >-
    PageSpeed Insights / CrUX API; Search Console CWV groups; approved first-party RUM; lab diagnostics
  cadence:
    triggers: []
    interval: weekly
    windowDays: 30
    source: >-
      Weekly for 30 days
  notes: >-
    Purpose: measurement; relevance/ranking consideration. C22. CrUX API/PSI rolling collection periods span 28 days, but a newly launched page may contribute fewer observed days. First-party RUM can start at launch with its own stated window/sample and approved collection scope. Origin/group data is not a per-template guarantee; do not average percentiles into one score. Status records review completion only. Sources: Web Vitals metrics; CrUX API collection window; CrUX methodology and coverage; Search Console CWV groups. Source IDs: SRC053; SRC054; SRC055; SRC056; SRC092; SRC097.
  automation: assisted
  remediationClass: code
  detectors: ["field-cwv-monitor"]
  sources:
    - id: "SRC053"
      topic: "Web Vitals metrics"
      url: "https://web.dev/articles/vitals"
      usedFor: >-
        1.5, 4.5, 6.2: LCP/INP/CLS at p75 by device; Good <=2.5 s/200 ms/0.1; TBT lab diagnostics do not replace field INP.
      verified: "2026-09-09"
    - id: "SRC054"
      topic: "CrUX API collection window"
      url: "https://developer.chrome.com/docs/crux/api"
      usedFor: >-
        4.11, 6.2: recorded 28-day collectionPeriod may contain fewer observed days; identify URL/origin and form factor.
      verified: "2026-09-09"
    - id: "SRC055"
      topic: "CrUX methodology and coverage"
      url: "https://developer.chrome.com/docs/crux/methodology"
      usedFor: >-
        4.11, 6.2: public discoverability and undisclosed popularity thresholds; missing coverage is not a performance grade.
      verified: "2026-09-09"
    - id: "SRC056"
      topic: "Search Console CWV groups"
      url: "https://support.google.com/webmasters/answer/9205520"
      usedFor: >-
        6.2: device-specific URL groups and origin fallback; distinguish group evidence from an individual URL measurement.
      verified: "2026-09-09"
    - id: "SRC092"
      topic: "INP historical date"
      url: "https://web.dev/blog/responsiveness"
      usedFor: >-
        H07 source correction for 4.5/6.2: the page's current notice states INP replaced FID on 2024-03-12. Retain current metric controls; do not describe this as an August/September 2026 launch rule.
      verified: "2026-09-09"
    - id: "SRC097"
      topic: "Page experience and ranking"
      url: "https://developers.google.com/search/docs/appearance/page-experience"
      usedFor: >-
        E02 / 6.2: Google uses Core Web Vitals in ranking; other page-experience work and reporting scores do not constitute a universal ranking score or guarantee.
      verified: "2026-09-10"
- id: "6.3"
