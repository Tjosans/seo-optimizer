- id: "1.3"
  phase: 1
  phaseLabel: "1 — Day 1 architecture"
  priority: P0
  profile: core
  launchGate: true
  applicability:
    universal: true
    any: []
    source: >-
      All sites
  task: >-
    Routing and canonicalization
  whatToDo: >-
    Pick one host and slash policy. Use stable, descriptive, human-readable URL paths; prefer lowercase and hyphens, and avoid unnecessary parameters or opaque identifiers where practical. Self-canonicalize indexable pages. 301 HTTP, host, case and slash variants to the preferred URL.
  doneWhen: >-
    Only one canonical version returns 200; alternates 301; canonical returns 200; priority URLs follow the documented descriptive path convention without accidental parameter duplicates.
  owners: ["developer"]
  ownerSource: >-
    Developer
  tools: >-
    curl -I; Screaming Frog; Search Console
  cadence:
    triggers: ["on-change"]
    source: >-
      Launch + after URL changes
  notes: >-
    v4.3: adds explicit descriptive URL and parameter conventions. See Sources: URL structure.
  automation: automated
  remediationClass: config
  detectors: ["canonicalization", "url-convention", "host-slash-policy"]
  sources:
    - topic: "URL structure"
      url: "https://developers.google.com/search/docs/crawling-indexing/url-structure"
      usedFor: >-
        Descriptive URL paths, characters and parameter best practices
      verified: "2026-08-26"
- id: "1.4"
  phase: 1
  phaseLabel: "1 — Day 1 architecture"
  priority: P0
  profile: core
  launchGate: true
  applicability:
    universal: true
    any: []
    source: >-
      All sites
  task: >-
    HTTP status handling
  whatToDo: >-
    Return real 200, 301, 404 and, when intentionally used, 410 responses. Avoid soft 404s, redirect chains and loops; keep the 404 experience useful while returning status 404. For internal search, noindex valid result-state pages unless deliberately included in the indexability plan; return a genuine 404 for nonexistent or error-like URLs, and do not expose empty or thin search-result URLs as indexable 200 pages.
  doneWhen: >-
    Representative success, redirect, missing, removed and internal-search URLs return the intended status and indexability; no tested empty-result or error-like URL is an indexable thin 200 or soft 404.
  owners: ["developer"]
  ownerSource: >-
    Developer
  tools: >-
    curl -I; Screaming Frog; server logs
  cadence:
    triggers: []
    interval: weekly
    windowDays: 30
    source: >-
      Launch + weekly for 30 days
  notes: >-
    v3: absorbed the 404 UX requirement that was previously bundled into 1.8.
  automation: automated
  remediationClass: code
  detectors: ["http-status", "soft-404", "redirect-chain", "internal-search-indexability"]
  sources: []
