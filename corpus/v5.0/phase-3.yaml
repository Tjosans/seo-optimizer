- id: "3.13"
  phase: 3
  phaseLabel: "3 — Content & trust"
  priority: P0
  profile: core
  launchGate: true
  applicability:
    universal: false
    any: ["ugc", "reviews"]
    source: >-
      Sites with public UGC, listings, third-party publishing or review collection, solicitation or display
  task: >-
    Public content, third-party publishing and review safeguards
  whatToDo: >-
    Before public content launches, set moderation, publication/indexability thresholds and escalation owners. Review third-party provenance, purpose, responsibility, integration and actual arrangements against current spam policies; assess batches under 3.9. Qualify paid links with sponsored or accepted nofollow and handle UGC links appropriately. Before collecting/displaying reviews, shipping review markup or making the first request, approve the destination-specific rules in 7.6 and test the actual request, staff guidance and moderation flow.
  doneWhen: >-
    Applicable publication/moderation controls work and policy defects are resolved before release. Record actual third-party arrangements and current policy version; authorship alone is not abuse. For reviews, retain genuine provenance, required disclosures, moderation/takedown evidence and approval of each destination's rules before first use. Reapprove changed platforms, incentives or request/moderation flows before use. Escalation covers relevant Search Console notices and policy review routes.
  owners: ["trust-safety", "developer", "business", "seo"]
  ownerSource: >-
    Trust & safety + business + SEO + developer
  tools: >-
    Moderation tools; crawler; Search Console; destination policy and request-flow review
  cadence:
    triggers: []
    source: >-
      Before public-content launch or first review collection/display/request; before material programme changes
  notes: >-
    Purpose: security/governance; legal/accessibility. H04. Verified 2026-09-09: site-reputation manual-action effects differ by searcher location. Outside the EEA they affect the identified section; inside the EEA that impact does not apply and the section may rank independently over time. No immunity or automatic outcome is promised. Integration factors are assessed together. Sources: Spam policies; Site reputation policy update; Outbound-link qualification. Source IDs: SRC029; SRC030; SRC080; SRC082; SRC083.
  automation: assisted
  remediationClass: content
  detectors: ["ugc-governance", "outbound-link-qualification", "review-integrity"]
