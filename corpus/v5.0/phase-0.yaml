- id: "0.5"
  phase: 0
  phaseLabel: "0 — Discovery & strategy"
  priority: P2
  profile: extended
  launchGate: false
  applicability:
    universal: false
    any: ["entity-identity"]
    source: >-
      Sites documenting organization/person identity and relevant official profiles
  task: >-
    Brand and entity baseline
  whatToDo: >-
    Record the actual public brand and relevant legal identity, logo and official profiles that already exist or serve a real business purpose. Verify what entity each URL identifies and who controls or maintains it where relevant. Use sameAs only for a page that unambiguously identifies the same entity. Do not create irrelevant profiles merely to complete this checklist.
  doneWhen: >-
    The identity record uses accurate names and relevant verified references. Selected sameAs URLs identify the same entity, not a related company, topic or product. Differences between legal and public brand names are intentional. Optional profile or schema adoption is not required, and no entity-recognition or ranking outcome is promised.
  owners: ["business", "seo"]
  ownerSource: >-
    Business + SEO
  tools: >-
    Brand doc; social/profile accounts
  cadence:
    triggers: ["once"]
    source: >-
      Once; update when profiles change
  notes: >-
    Purpose: security/governance; optional enhancement. C25. Optional identity governance and markup support. sameAs can refer to authoritative identity pages as well as controlled profiles; ownership is not the sole test. Source: Schema.org sameAs. Source IDs: SRC078.
  automation: assisted
  remediationClass: content
  detectors: ["brand-entity-consistency"]
  sources:
    - id: "SRC078"
      topic: "Schema.org sameAs"
      url: "https://schema.org/sameAs"
      usedFor: >-
        0.5: a reference page must unambiguously identify the same entity; controlled profiles are one possible reference, not a compulsory list.
      verified: "2026-09-09"
- id: "0.6"
  phase: 0
  phaseLabel: "0 — Discovery & strategy"
  priority: P2
  profile: extended
  launchGate: false
  applicability:
    universal: false
    any: ["ai-policy"]
    source: >-
      Sites deciding how their content is used by AI search and training systems
  task: >-
    AI crawler, AI-feature and training policy
  whatToDo: >-
    If an explicit AI-use policy is needed, maintain one provider/purpose register with owner, source/version date, scope, business reason and allow/block/limit decision. Separate ordinary Google crawl/index/preview rules, Search Console Search generative AI inclusion, Google-Extended, and each selected provider's search, training and user-directed fetch agents. Record the effective Search Console setting and any inherited parent or child override. Use current product documentation; do not assume one provider's robots behavior applies to another.
  doneWhen: >-
    Each selected control has a resolved purpose/scope decision and dated implementation evidence or a clearly recorded pending action. Google Search AI inclusion is separate from training and does not change ranking/inclusion in other Search parts. Record actual account access and inherited scope. Optional services and experimental files are not mandatory launch requirements, and no setting is presented as a universal AI opt-out.
  owners: ["business", "seo"]
  ownerSource: >-
    Business + SEO
  tools: >-
    Search Console Settings > Search generative AI; robots.txt; CDN/WAF rules; Sources sheet
  cadence:
    triggers: ["on-change"]
    interval: quarterly
    source: >-
      Before selected policy takes effect; after provider/scope changes; review quarterly
  notes: >-
    Purpose: security/governance; optional enhancement. H01/H02. Checked 2026-09-09: dedicated Google help announces worldwide rollout on 2026-08-31; verify the actual property. Google-Extended is a robots product token, not an HTTP user agent, and covers its documented Gemini training/grounding uses. llms.txt remains optional/experimental; Google Search ignores it for visibility/ranking. Sources: Search AI control; Google common crawlers; Google AI optimization. Source IDs: SRC002; SRC018; SRC037; SRC084; SRC085; SRC086.
  automation: attested
  remediationClass: config
  detectors: []
  sources:
    - id: "SRC002"
      topic: "OpenAI crawlers"
      url: "https://developers.openai.com/api/docs/bots"
      usedFor: >-
        0.6/2.9: independent OAI-SearchBot search and GPTBot training controls, user-directed ChatGPT-User whose requests may not follow robots, current provider identity evidence.
      verified: "2026-09-09"
    - id: "SRC018"
      topic: "Search AI control"
      url: "https://support.google.com/webmasters/answer/16908024?hl=en"
      usedFor: >-
        0.6/2.9: worldwide 2026-08-31 announcement, effective inherited/overridden property choice, specific Search AI inclusion scope distinct from training and other Search ranking.
      verified: "2026-09-09"
    - id: "SRC037"
      topic: "Google AI optimization"
      url: "https://developers.google.com/search/docs/fundamentals/ai-optimization-guide"
      usedFor: >-
        0.6: no required llms.txt, special AI markup or Markdown for Google Search; such files are ignored for Google visibility/ranking. Other services need their own documented case.
      verified: "2026-09-09"
    - id: "SRC084"
      topic: "Google common crawlers"
      url: "https://developers.google.com/crawling/docs/crawlers-fetchers/google-common-crawlers"
      usedFor: >-
        0.6/2.9: Google-Extended is a product token without a separate HTTP UA, with specified Gemini training/grounding scope and no ordinary Google Search inclusion/ranking effect.
      verified: "2026-09-09"
    - id: "SRC085"
      topic: "Anthropic bots"
      url: "https://support.claude.com/en/articles/8896518-does-anthropic-crawl-data-from-the-web-and-how-can-site-owners-block-the-crawler"
      usedFor: >-
        0.6/2.9: ClaudeBot training, Claude-SearchBot search and Claude-User user-directed retrieval, with provider-documented robots compliance and identity guidance.
      verified: "2026-09-09"
    - id: "SRC086"
      topic: "Perplexity crawlers"
      url: "https://docs.perplexity.ai/docs/resources/perplexity-crawlers"
      usedFor: >-
        0.6/2.9: PerplexityBot search versus Perplexity-User requested fetches that generally ignore robots; current identity/IP guidance, no inferred training scope.
      verified: "2026-09-09"
- id: "0.7"
  phase: 0
  phaseLabel: "0 — Discovery & strategy"
  priority: P0
  profile: core
  launchGate: true
  applicability:
    universal: false
    any: ["multilingual"]
    source: >-
      Multilingual / multi-country
  task: >-
    International market, localization and URL strategy
  whatToDo: >-
    Research needs per intended locale; choose stable folders, subdomains or ccTLDs and assign localization owners. Plan canonical/hreflang relationships, available page equivalents and localized journeys. Keep valuable translations independently indexable; document any preferred canonical for same-language regional duplicates. Provide user-controlled locale links instead of forced IP or browser-language redirects.
  doneWhen: >-
    Each launch locale has demand/user-need evidence, an owner, URL/content plan and approved canonical/hreflang and journey decisions. Same-language consolidation is justified explicitly; distinct translations are not collapsed to one language. Users and crawlers can reach intended variants.
  owners: ["developer", "seo"]
  ownerSource: >-
    Developer + SEO
  tools: >-
    hreflang tester; GSC
  cadence:
    triggers: ["before-build"]
    source: >-
      Before routes are coded
  notes: >-
    Purpose: indexing/discovery; relevance/ranking consideration. C07. Plan regional differences deliberately; localization does not require identical offers in every market. Source: International sites; Localized versions / hreflang. Source IDs: SRC012; SRC013.
  automation: attested
  remediationClass: config
  detectors: []
  sources:
    - id: "SRC012"
      topic: "International sites"
      url: "https://developers.google.com/search/docs/specialty/international/managing-multi-regional-sites"
      usedFor: >-
        0.7, 1.14, 4.9: stable locale URLs, visible language, user choice and documented same-language regional canonical consolidation.
      verified: "2026-09-09"
    - id: "SRC013"
      topic: "Localized versions / hreflang"
      url: "https://developers.google.com/search/docs/specialty/international/localized-versions"
      usedFor: >-
        0.7, 1.14, 4.9: supported codes, fully qualified equivalent URLs, self/return references and intentional x-default fallback.
      verified: "2026-09-09"
- id: "0.8"
  phase: 0
  phaseLabel: "0 — Discovery & strategy"
  priority: P0
  profile: core
  launchGate: true
  applicability:
    universal: false
    any: ["migration", "inherited-domain"]
    source: >-
      Migration / redesign / URL change; inherited or previously used domain
  task: >-
    Migration and inherited-domain discovery
  whatToDo: >-
    Record URL-move and domain-history scope separately. For inherited domains, inspect available GSC manual actions, security issues and prior URL removals during discovery and recheck before cutover. For moves, inventory pages/assets, important links and available traffic/ranking baselines; approve URL outcomes, content parity, freeze/DNS timing, recovery owners and old-domain continuity. Plan redirects for at least one year and an eligible Change of Address property matrix.
  doneWhen: >-
    History findings, access limitations and required remedies are recorded; unresolved required checks or blocking inherited issues fail. For moves, the complete inventory/map, baseline limitations, cutover/freeze plan, recovery reference and redirect/domain-retention owner are approved before build completion and current at cutover. A history-only case records that no URL move applies; it does not require redirects or Change of Address.
  owners: ["developer", "seo"]
  ownerSource: >-
    Developer + SEO
  tools: >-
    URL inventory/map; GSC reports and property matrix; recovery runbook
  cadence:
    triggers: ["before-build", "cutover"]
    source: >-
      Before build; update through cutover
  notes: >-
    Purpose: indexing/discovery; security/governance. C21/F01. Change of Address excludes protocol-only, same-domain www, hosting-only and same-domain path moves. Eligible moves require the same Google account to own old/new properties; source scope excludes paths and does not include child subdomains automatically. Include verified source variants, including www/non-www, even when inactive. Sources: Google site moves; Change of Address; Manual actions; Security issues. Source IDs: SRC011; SRC059; SRC060; SRC061.
  automation: assisted
  remediationClass: config
  detectors: ["migration-map-builder", "inherited-domain-history"]
  sources:
    - id: "SRC011"
      topic: "Google site moves"
      url: "https://developers.google.com/search/docs/crawling-indexing/site-move-with-url-changes"
      usedFor: >-
        0.8, 4.8, 5.2: domain history, URL outcomes, destination/redirect sequencing and at-least-one-year redirect guidance. Keep the tool's separate 180-day effect distinct.
      verified: "2026-09-09"
    - id: "SRC059"
      topic: "Change of Address"
      url: "https://support.google.com/webmasters/answer/9370220"
      usedFor: >-
        0.8, 4.8, 5.2: eligible/excluded moves, same-account ownership, source property/variant scope and submission after live redirects; tool effect is 180 days.
      verified: "2026-09-09"
    - id: "SRC060"
      topic: "Manual actions"
      url: "https://support.google.com/webmasters/answer/9044175"
      usedFor: >-
        0.8, 6.5: inspect actual report findings, including inherited-site actions, and verify remediation/review outcomes.
      verified: "2026-09-09"
    - id: "SRC061"
      topic: "Security issues"
      url: "https://support.google.com/webmasters/answer/9044101"
      usedFor: >-
        0.8, 6.5: inherited-site problems, investigation and remediation; reported example URLs are not necessarily exhaustive.
      verified: "2026-09-09"
- id: "0.9"
  phase: 0
  phaseLabel: "0 — Discovery & strategy"
  priority: P0
  profile: core
  launchGate: true
  applicability:
    universal: true
    any: []
    source: >-
      All sites; obligations vary
  task: >-
    Legal, privacy, consent and accessibility scope decision
  whatToDo: >-
    Document jurisdictions, business model, audience, data collection, required legal/consumer information and consent approach. Record accessibility obligations or exemptions with qualified review where needed. Specify the adopted WCAG version/level, pages and complete journeys assessed, supported technology scope, and which access/obligation requirements block release. Separate an assessment from any conformance claim.
  doneWhen: >-
    A dated scope decision identifies applicable requirements and evidence, owners and qualified escalation. The accessibility target and blocking criteria are explicit. Legal applicability/exemptions are supported by the appropriate review; SEO completion is not legal sign-off or proof of conformance.
  owners: ["accessibility", "business", "privacy", "legal"]
  ownerSource: >-
    Business + legal/privacy + accessibility
  tools: >-
    Legal scope checklist; Sources sheet
  cadence:
    triggers: ["before-build"]
    source: >-
      Before design/build; revisit when scope changes
  notes: >-
    Purpose: legal/accessibility; security/governance. C19. Accessibility and obligation scope protects users and delivery decisions. Record the actual required target; do not assume one WCAG version or a legal exemption applies universally. Sources: WCAG 2.2; Accessibility evaluation. Source IDs: SRC014; SRC015.
  automation: attested
  remediationClass: config
  detectors: []
  sources:
    - id: "SRC014"
      topic: "WCAG 2.2"
      url: "https://www.w3.org/TR/WCAG22/"
      usedFor: >-
        0.9, 4.4: declared target and conformance requirements, including full pages/processes, supported use and non-interference; qualified scope determines obligations.
      verified: "2026-09-09"
    - id: "SRC015"
      topic: "Accessibility evaluation"
      url: "https://www.w3.org/WAI/test-evaluate/"
