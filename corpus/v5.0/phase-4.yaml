- id: "4.11"
  phase: 4
  phaseLabel: "4 — Pre-launch QA"
  priority: P1
  profile: core
  launchGate: false
  applicability:
    universal: true
    any: []
    source: >-
      All sites
  task: >-
    Dated pre-launch crawl, performance and visibility baseline
  whatToDo: >-
    Archive a dated release baseline: crawl, representative lab results with the 1.5 profile, schema checks and available field data. Label field source, URL/origin/group/cohort, devices, window and data sufficiency. For a replaced live site also retain available rankings, traffic and top landing pages. For a first launch explicitly record which historical or field measurements do not exist.
  doneWhen: >-
    The release-linked baseline is findable and identifies comparable measurements and limitations. Missing field or historical data is Unavailable in evidence with a reason and next review, never invented or replaced by a lab score. Post-launch comparisons identify any population, configuration or window change.
  owners: ["seo"]
  ownerSource: >-
    SEO
  tools: >-
    Screaming Frog export; PageSpeed; GSC export; analytics export
  cadence:
    triggers: ["before-launch", "once"]
    source: >-
      Once, immediately before launch
  notes: >-
    Purpose: measurement. C22. A new site need not possess pre-launch field history. Migration-critical baseline evidence remains scoped in 0.8/4.8. Sources: Lab versus field data; CrUX methodology and coverage; CrUX API collection window. Source IDs: SRC006; SRC054; SRC055.
  automation: automated
  remediationClass: config
  detectors: ["prelaunch-baseline-snapshot"]
