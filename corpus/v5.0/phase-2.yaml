      verified: "2026-09-09"
- id: "2.17"
  phase: 2
  phaseLabel: "2 — Pre-launch config"
  priority: P1
  profile: core
  launchGate: false
  applicability:
    universal: false
    any: ["hierarchical"]
    source: >-
      Sites with hierarchical content or category structures
  task: >-
    Breadcrumb navigation and BreadcrumbList markup
  whatToDo: >-
    Provide visible, crawlable breadcrumbs representing a useful typical user path; keep linked ancestors aligned with intended canonical URLs. Do not merely mirror URL strings or invent hierarchy. Where BreadcrumbList is used, match the visible trail and validate at least two correctly ordered ListItems, names and required links. Google permits the last item to omit item; home/current-page crumbs are not automatically required.
  doneWhen: >-
    Selected hierarchical templates have usable navigation and working canonical ancestor links. Shipped BreadcrumbList matches the visible hierarchy and relevant required properties; positions/names/links are correct on tested states. A permitted last-item link omission is accepted. Record eligibility separately from actual search display.
  owners: ["developer", "designer", "seo"]
  ownerSource: >-
