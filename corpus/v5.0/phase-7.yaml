- id: "6.8"
  phase: 7
  phaseLabel: "7 — Ongoing"
  priority: P2
  profile: extended
  launchGate: false
  applicability:
    universal: false
    any: ["link-risk", "inherited-domain"]
    source: >-
      Sites investigating material inbound-link risk or inherited link schemes
  task: >-
    Link-risk triage and conditional disavow response
  whatToDo: >-
    Investigate material inbound-link concerns using actual link history and Search Console evidence. Consider disavow only when a considerable number of artificial, spammy or low-quality links exist AND they have caused or are likely to cause a manual action. Attempt removal where feasible first. An alleged attack or toxicity score alone is insufficient. Before an approved upload, confirm ownership of the intended URL-prefix property, preserve its current list and review the exact replacement; Domain properties are unsupported.
  doneWhen: >-
    Record the evidence, qualified decision and reason for acting or taking no action; most sites need no disavow. Any approved submission meets both threshold conditions, documents feasible removal attempts and targets the correct property without unintentionally losing prior entries. Keep the submitted version and follow-up record; processing is not immediate and recovery is not guaranteed. No upload is required merely to pass this control.
  owners: ["seo"]
  ownerSource: >-
    SEO lead + property owner
  tools: >-
    Search Console Links/manual actions; link history; disavow tool only when justified
  cadence:
    triggers: ["before-launch"]
    source: >-
      Incident-driven from pre-launch onward; revisit when link-risk evidence changes
  notes: >-
    Purpose: security/governance; optional enhancement. C24. Optional incident response, moved to Ongoing while retaining stable ID 6.8. Do not infer a manual-action risk from third-party toxicity scores alone. Source: Disavow links to your site. Source IDs: SRC081.
  automation: assisted
  remediationClass: config
  detectors: ["backlink-monitor"]
  sources:
    - id: "SRC081"
      topic: "Disavow links to your site"
      url: "https://support.google.com/webmasters/answer/2648487?hl=en"
      usedFor: >-
        6.8: both bad-link and manual-action thresholds; feasible removal first; URL-prefix ownership, existing-list replacement and delayed processing. Most sites do not need disavow.
      verified: "2026-09-09"
