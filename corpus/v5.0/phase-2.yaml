  tools: >-
    Rich Results Test; crawler; accessibility QA; Sources sheet
  cadence:
    triggers: ["before-launch", "on-change"]
    source: >-
      Before launch for hierarchical templates; after navigation changes
  notes: >-
    Purpose: indexing/discovery; search-feature eligibility. E04. Retain this existing conditional nongate control. Google's breadcrumb feature is available on desktop; that does not restrict useful on-page navigation to desktop. No guaranteed display or ranking benefit. Source: Breadcrumb navigation. Source IDs: SRC036.
  automation: automated
  remediationClass: code
  detectors: ["breadcrumb-navigation", "breadcrumblist-schema"]
  sources:
