- id: "4.10"
  phase: 4
  phaseLabel: "4 — Pre-launch QA"
  priority: P0
  profile: core
  launchGate: true
  applicability:
    universal: false
    any: ["ecommerce"]
    source: >-
      E-commerce / product catalogue
