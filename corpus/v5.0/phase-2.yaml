      verified: "2026-09-09"
- id: "2.18"
  phase: 2
  phaseLabel: "2 — Pre-launch config"
  priority: P1
  profile: extended
  launchGate: true
  applicability:
    universal: false
    any: ["news"]
    source: >-
      News publishers with a news programme in the release scope
  task: >-
    News publishing policy and news sitemap QA
  whatToDo: >-
    Record publisher/company/contact details, accountable bylines and accurate original publication dates. Distinguish editorial work from advertising and disclose material sponsorship. Test current Google News policy requirements for the selected programme. If a news sitemap is used, update it as articles publish; include news metadata only for the last two days and at most 1,000 news entries per file. Validate publication name/language, original publication date and article title.
  doneWhen: >-
    The news-policy review and tested article templates match accountable publishing and clear sponsorship. A selected news feed validates, dates are original and aged entries/news metadata are removed while appropriate normal sitemap coverage remains. An intentionally empty feed is acceptable. No news sitemap or AMP is required for ordinary websites. Unresolved applicable policy or implemented-feed defects block this module; Google News inclusion is not guaranteed.
  owners: ["developer", "business", "content", "seo"]
  ownerSource: >-
    Editor + publisher + developer + SEO
  tools: >-
    News-policy review; article/source inspection; news sitemap validator; Search Console when available
  cadence:
    triggers: []
    windowDays: 30
    source: >-
      Before news programme launch; each publication/feed change; first 30 days monitoring
  notes: >-
    Purpose: search-feature eligibility; security/governance. D04. Conditional news-policy/implemented-feed gate, separate from Discover 2.16. This is the site's release dependency for its chosen news programme, not a universal Google Search ranking prerequisite. Sources: Google News policies; News sitemaps. Source IDs: SRC076; SRC077.
  automation: assisted
  remediationClass: code
  detectors: ["news-sitemap", "news-article-policy"]
  sources:
    - id: "SRC076"
      topic: "Google News policies"
      url: "https://support.google.com/news/publisher-center/answer/6204050?hl=en"
      usedFor: >-
