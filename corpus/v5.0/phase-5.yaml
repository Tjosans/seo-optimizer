- id: "5.4"
  phase: 5
  phaseLabel: "5 — Launch day"
  priority: P0
  profile: core
  launchGate: true
  applicability:
    universal: true
    any: []
    source: >-
      All sites
  task: >-
    Verify production sitemap and priority URLs; record submission status
  whatToDo: >-
    On the production origin, verify sitemap fetchability when a sitemap is used; otherwise confirm the approved omission and internal-discovery evidence and inspect the homepage and representative priority templates for response, crawl/indexing directives, declared canonical and rendered content. If a sitemap is used, submit it in the correctly scoped Search Console property when account/service access is available, recording actual status/time. Use live URL Inspection where available alongside direct HTTP/rendered evidence. Record unavailable access or service functions with evidence, an owner and follow-up; never infer indexed status or Google-selected canonical from a live test.
  doneWhen: >-
    Production evidence matches the approved URL matrix for sampled launch-critical patterns and any intended sitemap is reachable; an approved omission has matching internal-discovery evidence. No known blocking live fetch/directive/canonical/content defect remains. For an implemented sitemap, submission is either evidenced or explicitly pending with an owner and next action; unavailable account/service access alone does not block. Record absent indexed data as Unavailable and follow up under 6.1. Delay or missing reports cannot excuse a demonstrated technical defect or replace required live evidence.
  owners: ["seo"]
  ownerSource: >-
    SEO
  tools: >-
    Google Search Console; URL Inspection
  cadence:
    triggers: ["launch-day"]
    source: >-
      Launch day
  notes: >-
    Purpose: indexing/discovery; measurement. C14 dependency. This remains a live technical gate. Recommended SC setup/submission and report availability are tracked separately and do not create an artificial indexing prerequisite. Keep declared/live and Google-selected/indexed canonical evidence separate. Sources: Search Console property types; existing live URL Inspection guidance. E02: the sitemap adoption decision follows 2.1; omission does not waive production URL tests. Source: Sitemap use decision. Source IDs: SRC009; SRC010; SRC019; SRC038; SRC087; SRC096.
  automation: assisted
  remediationClass: config
  detectors: ["sitemap-submit", "url-inspection"]
  sources:
    - id: "SRC009"
      topic: "Robots meta and X-Robots-Tag"
      url: "https://developers.google.com/search/docs/crawling-indexing/robots-meta-tag"
      usedFor: >-
        B03 and 0.3, 1.10, 1.16: intentional noindex needs crawl access; headers cover non-HTML files. Directives do not replace authorization.
      verified: "2026-09-08"
    - id: "SRC010"
      topic: "Canonicalization"
      url: "https://developers.google.com/search/docs/crawling-indexing/consolidate-duplicate-urls"
      usedFor: >-
        1.3, 1.6, 1.16: retained duplicates, preferred-URL signals, supported non-HTML Link canonical; selection is not guaranteed.
      verified: "2026-09-08"
    - id: "SRC019"
      topic: "URL Inspection: live vs indexed"
      url: "https://support.google.com/webmasters/answer/9012289?hl=en"
      usedFor: >-
        B04: live evidence cannot establish Google-selected canonical
      verified: "2026-09-07"
    - id: "SRC038"
      topic: "JavaScript SEO basics"
      url: "https://developers.google.com/search/docs/crawling-indexing/javascript/javascript-seo-basics"
      usedFor: >-
        1.1, 1.10: rendering, raw noindex, canonical consistency and crawlable output; SSR is a reliability policy.
      verified: "2026-09-08"
    - id: "SRC087"
      topic: "Search Console property types"
      url: "https://support.google.com/webmasters/answer/34592?hl=en"
      usedFor: >-
        2.4/5.4: Domain versus URL-prefix scope/verification and monitoring access; adding a property is not a website Search or ranking prerequisite.
      verified: "2026-09-09"
    - id: "SRC096"
      topic: "Sitemap use decision"
      url: "https://developers.google.com/search/docs/crawling-indexing/sitemaps/overview"
      usedFor: >-
        2.1 / 5.4: sitemaps aid discovery and often help new/complex sites; an appropriate approved omission does not itself prevent indexing.
      verified: "2026-09-10"
- id: "5.5"
  phase: 5
  phaseLabel: "5 — Launch day"
  priority: P0
  profile: core
  launchGate: true
  applicability:
    universal: true
    any: []
    source: >-
      All sites
  task: >-
    Availability, indexability and canonical canaries
  whatToDo: >-
    Confirm the monitoring prepared in 4.12 is active on production. Check uptime, 5xx/429, DNS/SSL expiry, robots status/content, sitemap failure, canonical and unintended-noindex canaries. Include accidental robots 4xx and failed refresh/cache cases. Use a safe synthetic signal to confirm live routing and the current response runbook; do not cause a production fault.
  doneWhen: >-
    Live canaries match the approved access/directive matrix. A safe test reaches the accountable monitored recipient within the target; severity and response steps cover the relevant URL, sitemap, robots and cache failures. Record delivery evidence and investigation ownership for anomalies.
  owners: ["developer"]
  ownerSource: >-
    Developer
  tools: >-
    Uptime monitor (Better Stack, Cronitor, UptimeRobot); scheduled GitHub Action; GSC alerts
  cadence:
    triggers: ["launch-day", "on-change"]
    source: >-
      Launch day; first-month review; approved periodic interval and after monitoring changes
  notes: >-
    Purpose: indexing/discovery; security/governance. D02/F03. Most robots 4xx except 429 mean no crawl restrictions for Google; server/network failures can interrupt crawling and retain cached rules. Pre-cutover setup/testing belongs to 4.12; this row confirms production operation. Sources: robots.txt interpretation; Monitoring distributed systems. Source IDs: SRC046; SRC050; SRC051.
  automation: assisted
  remediationClass: config
  detectors: ["availability-canary", "indexability-canary"]
  sources:
    - id: "SRC046"
      topic: "robots.txt interpretation"
      url: "https://developers.google.com/crawling/docs/robots-txt/robots-txt-spec"
      usedFor: >-
        2.1, 5.5: GET scope, groups, 500 KiB, cache/error behavior. Most 4xx except 429 mean no restrictions; failures may retain cached rules.
      verified: "2026-09-08"
    - id: "SRC050"
      topic: "Verify Google crawler requests"
      url: "https://developers.google.com/crawling/docs/crawlers-fetchers/verify-google-requests"
      usedFor: >-
        1.7,2.9,5.5,2.15: genuine crawler identity differs from synthetic user-agent probes; use documented DNS/IP methods before trusting crawler-only access.
      verified: "2026-09-09"
    - id: "SRC051"
      topic: "Monitoring distributed systems"
      url: "https://sre.google/sre-book/monitoring-distributed-systems/"
      usedFor: >-
        1.7, 4.12, 5.5: actionable symptoms, clear alert routing and external behavior checks; project readiness tests are an operating-policy application.
      verified: "2026-09-09"
- id: "5.6"
  phase: 5
  phaseLabel: "5 — Launch day"
  priority: P0
  profile: core
  launchGate: true
  applicability:
    universal: false
    any: ["analytics"]
    source: >-
      Sites using analytics or conversion measurement
  task: >-
    Live analytics and conversion smoke test
  whatToDo: >-
    Run the approved production smoke journeys using authorized test records. Confirm expected collection or suppression for relevant consent states and transitions, page/route events, attribution, values and deduplication. Check actual network/storage behavior and appropriate recipient diagnostics; reconcile permitted transactions with the system of record. Control test-data handling and repeat any affected failures before recording the live result.
  doneWhen: >-
    Required live cases match the approved 0.4/4.7 expectations: permitted events arrive accurately where expected, suppressed events remain absent, and denied paths work. No prohibited disclosure, duplicate purchase or required measurement failure remains. Record reporting latency and evidence limits without inferring receipt from configuration or demanding one analytics event for every action.
  owners: ["analytics", "developer", "business"]
  ownerSource: >-
    Analytics + business + developer
  tools: >-
    Analytics realtime/debug view; tag debugger; transaction records
  cadence:
    triggers: ["launch-day"]
    source: >-
      Launch day
  notes: >-
    Purpose: measurement; legal/accessibility. C12/D06. Absence can be the correct consent outcome. Workbook completion neither promises full observability nor proves legal compliance. Keep live receipt/suppression evidence separate from later aggregate reporting. Sources: Google Consent Mode; Analytics PII prevention; GA4 transaction IDs. Source IDs: SRC004; SRC065; SRC067.
  automation: assisted
  remediationClass: config
  detectors: ["live-analytics-smoke"]
  sources:
    - id: "SRC004"
      topic: "Google Consent Mode"
      url: "https://developers.google.com/tag-platform/security/concepts/consent-mode"
      usedFor: >-
        0.4, 2.6, 5.6: Basic/Advanced behavior, consent types and limitations. Denied storage can still involve transmission in Advanced mode; mode selection follows qualified scope.
      verified: "2026-09-09"
    - id: "SRC065"
      topic: "Analytics PII prevention"
      url: "https://support.google.com/analytics/answer/6366371"
      usedFor: >-
        2.5, 4.7, 5.6: remove prohibited identifiers from URLs, titles and collected fields; redaction settings are not complete payload verification.
      verified: "2026-09-09"
    - id: "SRC067"
      topic: "GA4 transaction IDs"
      url: "https://support.google.com/analytics/answer/12313109"
      usedFor: >-
        2.5, 4.7, 5.6: web purchase deduplication needs unique nonempty transaction IDs without customer-identifying data; avoid reused IDs and generic deduplication claims.
      verified: "2026-09-09"
- id: "5.7"
  phase: 5
  phaseLabel: "5 — Launch day"
  priority: P0
  profile: extended
  launchGate: false
  applicability:
    universal: true
    any: []
    source: >-
      All sites
  task: >-
    Record launch-owner decision and rollback window.
  whatToDo: >-
    After reviewing the current calculated launch assessment and the production evidence, the named launch owner records GO, HOLD with remediation, or rollback for the identified release and approved scope. Record the decision time, evidence reference, remaining risks, action owners and rollback-window end. Keep the responsible people available through that window. Reassess and update the record after a failed check, remediation, rollback or material release change.
  doneWhen: >-
    A complete dated human decision record exists and agrees with the current release, scope and evidence. A recorded GO is permitted only while the calculated final assessment is GO. Recording a HOLD or rollback can complete this administrative record; it does not change the calculated assessment.
  owners: ["developer", "business", "seo"]
  ownerSource: >-
    Launch owner + developer + SEO + business
  tools: >-
    Launch runbook; monitoring; crawl; analytics
  cadence:
    triggers: ["launch-window"]
    source: >-
      Launch window
  notes: >-
    Purpose: security/governance. Decision recording is outside its own prerequisites. Calculated readiness, owner authorization, production verification and the final human decision are separate facts. Operating design; no external ranking claim. Related controls: 4.12, 5.1, 5.2, 5.3, 5.4, 5.5, 5.6.
  automation: attested
  remediationClass: config
  detectors: []
  sources: []
