- id: "6.4"
  phase: 6
  phaseLabel: "6 — First 30 days"
  priority: P1
  profile: extended
  launchGate: false
  applicability:
    universal: false
    any: ["ai-reporting"]
    source: >-
      Sites with available AI-search reporting or meaningful AI referrals
  task: >-
    AI search visibility baseline
  whatToDo: >-
    Record actual Google Search Generative AI report availability and earliest data date. Use its impressions for AI Overviews/AI Mode with property/page aggregation, device/country, date range and reporting time zone; Discover uses a separate report and Search Labs is excluded. Preserve missing-data markers before export, which may convert them to zeros. If selected, keep Bing AI citation counts and grounding-query samples separate. Measure identifiable AI referral sessions only under the approved analytics scope; optional dated prompt spot checks are anecdotal.
  doneWhen: >-
    The baseline names each report, metric, scope, period and availability limits. Google AI impressions are not clicks, CTR, rankings or all-provider visibility; Bing citations are not those metrics either. Referral sessions have their own attribution limits. Do not sum incompatible datasets or equate chart/table totals with different aggregation. Record unavailable/insufficient data explicitly and do not fabricate pre-availability history. Prompt examples are not representative coverage estimates.
  owners: ["seo"]
  ownerSource: >-
    SEO
  tools: >-
    SC Search/Discover AI reports where available; optional Bing AI Performance; approved referral analytics
  cadence:
    triggers: []
    interval: monthly
    source: >-
      Day 30; then monthly
  notes: >-
    Purpose: measurement. H01/C23. Checked 2026-09-09: Google announces worldwide AI-report rollout as of 2026-08-31, while its help still lists account/data caveats. Verify actual availability. Bing's cited announcement labels AI Performance public preview; verify current account features and metric scope. Sources: Search AI performance report; Bing AI Performance. Source IDs: SRC034; SRC090.
  automation: automated
  remediationClass: content
  detectors: ["ai-visibility-baseline"]
  sources:
    - id: "SRC034"
      topic: "Search AI performance report"
      url: "https://support.google.com/webmasters/answer/16984139"
      usedFor: >-
        6.4: Search AI impressions, actual availability, separate Discover/Labs scope, property/page aggregation, PT dates and missing values becoming zeros on export; no click/CTR or all-AI visibility interpretation.
      verified: "2026-09-09"
    - id: "SRC090"
      topic: "Bing AI Performance"
      url: "https://blogs.bing.com/webmaster/February-2026/Introducing-AI-Performance-in-Bing-Webmaster-Tools-Public-Preview"
      usedFor: >-
        6.4: optional public-preview AI citations, cited pages and sampled grounding queries. These are not clicks, rankings or comprehensive AI visibility. General Bing crawl/index follow-up is an operating procedure supported separately by the sitemap guidance.
      verified: "2026-09-11"
- id: "6.5"
  phase: 6
  phaseLabel: "6 — First 30 days"
  priority: P1
  profile: core
  launchGate: false
  applicability:
    universal: true
    any: []
    source: >-
      All sites
  task: >-
    Security and manual action monitoring
  whatToDo: >-
    Review GSC Security Issues, Manual Actions and alerts; maintain the CMS/dependency patching owner and investigate unexpected published URLs. Record report scope, access limitations and findings with incident owners, remedies and next checks. Use site: only as a supplemental discovery aid. Recheck after launch, on alerts and after material incidents; inherited-domain checks also belong before cutover in 0.8.
  doneWhen: >-
    Required reports were actually reviewed, findings were investigated and actions/escalation are recorded. Missing access is explicit and the affected review stays incomplete. Critical incidents remain open until verified remediation; review completion does not mean the site has no issues. Do not infer a clean site from absent search results or a short sample of affected URLs.
  owners: ["developer"]
  ownerSource: >-
    Developer
  tools: >-
    Search Console reports/alerts; CMS and dependency security tooling; incident log
  cadence:
    triggers: []
    interval: monthly
    windowDays: 30
    source: >-
      Weekly for 30 days; then monthly
  notes: >-
    Purpose: security/governance. F01. The Status records completion of this monitoring review, not a security certification or absence of manual actions. Preserve incident outcomes separately and reopen affected release controls. Sources: Manual actions; Security issues; site: operator limitations. Source IDs: SRC060; SRC061.
  automation: assisted
  remediationClass: config
  detectors: ["security-manual-actions"]
  sources:
    - id: "SRC060"
      topic: "Manual actions"
      url: "https://support.google.com/webmasters/answer/9044175"
      usedFor: >-
        0.8, 6.5: inspect actual report findings, including inherited-site actions, and verify remediation/review outcomes.
      verified: "2026-09-09"
    - id: "SRC061"
      topic: "Security issues"
      url: "https://support.google.com/webmasters/answer/9044101"
      usedFor: >-
        0.8, 6.5: inherited-site problems, investigation and remediation; reported example URLs are not necessarily exhaustive.
      verified: "2026-09-09"
- id: "6.6"
