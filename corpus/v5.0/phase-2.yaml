    Selected templates have accurate previews and documented policy/image decisions. Record actual indexed evidence or a post-launch follow-up when unavailable. Preferred Sources adoption and current eligibility are recorded separately; an absent optional button or lack of source availability is not a launch failure. An implemented flow targets the intended site. Eligibility and user choice do not guarantee traffic or general ranking gains.
