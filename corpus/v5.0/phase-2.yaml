- id: "2.10"
  phase: 2
  phaseLabel: "2 — Pre-launch config"
  priority: P2
  profile: extended
  launchGate: false
  applicability:
    universal: false
    any: ["indexnow"]
    source: >-
      Sites prioritizing IndexNow search engines
  task: >-
    IndexNow submission
  whatToDo: >-
    If selected, notify currently participating IndexNow engines of added, materially updated and deleted URLs through publish/unpublish workflows. Verify host ownership, public key-file content/location and permitted URL scope. Test 200 receipt, 202 pending key validation and documented error responses; correct invalid requests and back off safely on rate limits. Check current participants instead of hard-coding an engine list. Maintain normal crawlable links and valid sitemaps, including for Google.
  doneWhen: >-
    Add, update and deletion events send the intended in-scope URLs without persistent retry loops. Keys and host/path scope validate; receipt, pending validation and failures are logged distinctly with a follow-up owner. Successful notification is not evidence of crawling or indexing. No IndexNow integration is required if this optional scope is excluded.
  owners: ["developer"]
  ownerSource: >-
    Developer
  tools: >-
    IndexNow API; Bing Webmaster Tools
  cadence:
    triggers: ["on-change"]
    interval: monthly
    source: >-
      Publish/unpublish events if adopted; after key/host changes; monthly failure review
  notes: >-
    Purpose: indexing/discovery; optional enhancement. C16. Optional discovery notification, including deletions. Google discovery also uses links and other mechanisms; it is not sitemap-only. Source: IndexNow protocol documentation. Source IDs: SRC017.
  automation: assisted
  remediationClass: config
  detectors: ["indexnow-integration"]
  sources:
    - id: "SRC017"
      topic: "IndexNow"
      url: "https://www.indexnow.org/documentation"
      usedFor: >-
        2.10: added/updated/deleted notifications, host/key/path validation,200 receipt versus 202 pending verification and error handling; current participating engines share notifications, not indexing guarantees.
      verified: "2026-09-09"
