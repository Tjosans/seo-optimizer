- id: "2.9"
  phase: 2
  phaseLabel: "2 — Pre-launch config"
  priority: P2
  profile: extended
  launchGate: false
  applicability:
    universal: false
    any: ["ai-policy"]
    source: >-
      Sites with an approved AI crawler policy
  task: >-
    Implement and verify optional AI crawler directives
  whatToDo: >-
    Implement the approved 0.6 register in supported robots, Search Console and edge controls. Distinguish OAI-SearchBot (search), GPTBot (training) and ChatGPT-User (user fetch); Claude-SearchBot, ClaudeBot and Claude-User; and PerplexityBot versus Perplexity-User. Verify each provider's current scope and identity method. Test permitted and denied rules, label custom-UA probes as simulations, and use trusted logs for genuine requests. Keep robots accessible to compliant crawlers; never grant private access solely from a user-agent string.
  doneWhen: >-
    Selected settings and observed behavior match the approved purposes and paths. Evidence separates rule simulations from identity-verified requests and marks unobserved behavior with an owner/follow-up. Google-Extended is tested as a product token, not a fictitious fetcher. User-directed retrieval may differ: OpenAI says robots may not apply to ChatGPT-User; Perplexity-User generally ignores it; Anthropic documents robots compliance for its bots. Robots and preview directives are not access control.
  owners: ["developer", "seo"]
  ownerSource: >-
    Developer + SEO
  tools: >-
    Provider documentation/register; SC effective settings; rule probes; provider identity verification; trusted logs
  cadence:
    triggers: ["on-change"]
    source: >-
      Before selected policy goes live; after provider, CDN/WAF or policy changes
  notes: >-
    Purpose: security/governance; optional enhancement. H02/D05. Preserve public-search access QA in 4.2/5.1. Apply each provider's current IP/DNS method; no generic Google identity test. For Bing, verify selected directives under Bing documentation; data-nosnippet excludes marked text from its snippets/AI summaries while retaining indexing. Sources: OpenAI crawlers; Anthropic bots; Perplexity crawlers; Bing snippet controls. Source IDs: SRC002; SRC018; SRC050; SRC084; SRC085; SRC086; SRC089.
  automation: assisted
  remediationClass: config
  detectors: ["ai-crawler-directive-verify"]
  sources:
    - id: "SRC002"
      topic: "OpenAI crawlers"
      url: "https://developers.openai.com/api/docs/bots"
      usedFor: >-
        0.6/2.9: independent OAI-SearchBot search and GPTBot training controls, user-directed ChatGPT-User whose requests may not follow robots, current provider identity evidence.
      verified: "2026-09-09"
    - id: "SRC018"
      topic: "Search AI control"
      url: "https://support.google.com/webmasters/answer/16908024?hl=en"
      usedFor: >-
        0.6/2.9: worldwide 2026-08-31 announcement, effective inherited/overridden property choice, specific Search AI inclusion scope distinct from training and other Search ranking.
      verified: "2026-09-09"
    - id: "SRC050"
      topic: "Verify Google crawler requests"
      url: "https://developers.google.com/crawling/docs/crawlers-fetchers/verify-google-requests"
      usedFor: >-
        1.7,2.9,5.5,2.15: genuine crawler identity differs from synthetic user-agent probes; use documented DNS/IP methods before trusting crawler-only access.
      verified: "2026-09-09"
    - id: "SRC084"
      topic: "Google common crawlers"
      url: "https://developers.google.com/crawling/docs/crawlers-fetchers/google-common-crawlers"
      usedFor: >-
        0.6/2.9: Google-Extended is a product token without a separate HTTP UA, with specified Gemini training/grounding scope and no ordinary Google Search inclusion/ranking effect.
      verified: "2026-09-09"
    - id: "SRC085"
      topic: "Anthropic bots"
      url: "https://support.claude.com/en/articles/8896518-does-anthropic-crawl-data-from-the-web-and-how-can-site-owners-block-the-crawler"
      usedFor: >-
        0.6/2.9: ClaudeBot training, Claude-SearchBot search and Claude-User user-directed retrieval, with provider-documented robots compliance and identity guidance.
      verified: "2026-09-09"
    - id: "SRC086"
      topic: "Perplexity crawlers"
      url: "https://docs.perplexity.ai/docs/resources/perplexity-crawlers"
      usedFor: >-
