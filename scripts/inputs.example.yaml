# Evidence a person supplies to an audit, for `npm run analyze -- <url> --inputs <this file>`.
#
# Each kind of evidence is a named section, added with the detector that reads
# it: an unknown section, a number where text belongs, or a date that does not
# parse is refused.
#
# Every record in a section carries the same three fields:
#
#   owner: Jane Doe                      # who answers for it; blank holds the check
#   recordedAt: 2026-09-01T09:00:00Z     # ISO 8601 with a zone
#   nextReviewAt: 2027-03-01T09:00:00Z   # optional; once past, the check is held
#
# A section left out makes the detectors that read it not-applicable.
#
# experiments (1.19, experiment-cloaking-divergence): tests served from their
# own URLs. A variant still indexable and canonical to itself, or an experiment
# past retireBy at crawl time, fails; a variant the crawl never reached warns.
experiments:
  - controlUrl: https://example.com/pricing
    variantUrls:
      - https://example.com/pricing-b
    method: redirect               # free text: how variants are served
    retireBy: 2026-12-01T00:00:00Z
    owner: Jane Doe
    recordedAt: 2026-09-01T09:00:00Z

# environments (1.8, staging-protection): the origins of the site's staging and
# preview environments. The crawl requests each root once, with no credentials.
# An answer of 200 with HTML fails; a redirect to a login page warns (protected,
# but by a page rather than a refusal); 401, 403, 404 or no answer passes.
# At least one of staging, preview is required.
environments:
  staging: https://staging.example.com
  preview: https://preview.example.com
  owner: Jane Doe
  recordedAt: 2026-09-01T09:00:00Z

# ciGuard (1.10, ci-seo-guards): the CI check that stops SEO regressions
# shipping. It fails unless seededDefectsCaught names all of noindex, canonical,
# crawler-access and critical-link (defects planted in a build and caught) and
# cleanRunPassed is true (an unmodified build passed).
ciGuard:
  build: ci-run-1842
  ranAt: 2026-09-10T08:00:00Z
  seededDefectsCaught: [noindex, canonical, crawler-access, critical-link]
  cleanRunPassed: true
  owner: Jane Doe
  recordedAt: 2026-09-10T09:00:00Z

# ciRules (1.11, ci-extended-checks): the extended rules the pipeline runs.
# falsePositiveRate is a fraction from 0 to 1. A rule with no owner or severity,
# or a rate over 0.1, warns; the check is assisted, so it never passes alone.
ciRules:
  - rule: no-orphan-pages
    severity: block
    falsePositiveRate: 0.02
    owner: Jane Doe
    recordedAt: 2026-09-10T09:00:00Z

# urlMatrix (0.3): what each URL pattern must do at launch, one row per pattern.
# pattern is an exact URL or a glob (* within a path segment, ** across
# segments), absolute or a path from the site root. status is the HTTP status
# expected; canonical is self, none or the URL it points to; access is public
# or private. priority (a launch template) and environment are optional.
urlMatrix:
  - pattern: https://example.com/products/*
    priority: true
    status: 200
    indexable: true
    canonical: self
    inSitemap: true
    access: public
    owner: Jane Doe
    recordedAt: 2026-09-01T09:00:00Z
  - pattern: /account/**
    status: 200
    indexable: false
    canonical: none
    inSitemap: false
    access: private
    environment: production
    owner: Jane Doe
    recordedAt: 2026-09-01T09:00:00Z

# canary (5.5, availability-canary): the URLs watched after launch and the alert
# that watches them. Fails a canary URL the crawl got a non-200 from, a test
# alert delivered later than targetMinutes after lastTestAlertAt, and an alert
# with no deliveredAt. lastTestAlertAt and deliveredAt are optional; without a
# test alert the check is held.
canary:
  urls: [https://example.com/]
  targetMinutes: 5
  recipient: oncall@example.com
  lastTestAlertAt: 2026-09-10T08:00:00Z
  deliveredAt: 2026-09-10T08:03:00Z
  owner: Jane Doe
  recordedAt: 2026-09-10T09:00:00Z

# redirectMap (0.8, migration): what each old URL must do after the move.
# kind is move (the site changes address or structure: name oldOrigin, list an
# entry per old URL) or history-only (nothing to carry over; entries may be
# left out). from is an absolute URL or a path from the old origin. expect is
# 301, 308, 404 or 410; a 301 or 308 needs to (a URL or path), a 404 or 410
# takes none. A repeated from is refused. changeOfAddress (5.2) is the Search
# Console move of oldOrigin: status pending or accepted, submittedAt a date and
# time; a pending one holds migration-redirects-live.
redirectMap:
  kind: move
  oldOrigin: https://old.example.com
  changeOfAddress:
    status: pending
    submittedAt: "2026-09-10T09:00:00Z"
  entries:
    - from: /products/blue-widget
      expect: 301
      to: https://example.com/products/blue-widget
    - from: /about-us
      expect: 308
      to: /about
    - from: /discontinued/widget
      expect: 410
  owner: Jane Doe
  recordedAt: 2026-09-10T09:00:00Z

# domainHistory (0.8): what was learned about the past of an inherited domain.
# checks lists what was looked at (name, result in your words, checkedAt); a
# manual-actions check and an archive check (a name containing "manual", and
# one containing "archive" or "wayback") are required. blockingIssues lists
# what the history turned up; any with resolved: false fails inherited-domain-history.
domainHistory:
  checks:
    - name: Manual actions review
      result: none found
      checkedAt: 2026-09-01T09:00:00Z
    - name: Wayback archive review
      result: previously a small blog, no spam
      checkedAt: 2026-09-01T09:30:00Z
  blockingIssues:
    - issue: Spammy backlinks inherited from the previous owner
      resolved: true
  owner: Jane Doe
  recordedAt: 2026-09-01T10:00:00Z

# searchConsole: what a person exports from Search Console. Every subsection is
# optional; an empty manualActions or securityIssues list is the report saying
# "no issues detected", which is an answer, not a gap. property.type is domain
# or url-prefix (a url-prefix url must be an http(s) URL); each owner needs an
# email and a verifiedAt. sitemaps rows carry the report's own status text and a
# whole-number error count; a sitemap listed twice is refused. A manual action's
# scope is site-wide or partial; detectedAt is optional on it and on a
# security issue.
searchConsole:
  property:
    type: domain
    url: sc-domain:example.com
    owners:
      - email: jane@example.com
        verifiedAt: 2026-08-01T09:00:00Z
  sitemaps:
    - url: https://example.com/sitemap.xml
      submittedAt: 2026-08-02T09:00:00Z
      status: Success
      errors: 0
  manualActions: []
  securityIssues: []
  # pageIndexing: the Page indexing report's not-indexed rows, an http(s) url and
  # the report's reason. urlInspection: one URL Inspection result per url, in
  # the tool's words; googleCanonical is optional. performance: clicks and
  # impressions (whole numbers, clicks no more than impressions) for a page,
  # and for a query when the export is split by one; period is the date range
  # as exported. links: the Links report's linking sites and their link counts.
  # Each list refuses a repeated row.
  pageIndexing:
    - url: https://example.com/old-page
      reason: Crawled - currently not indexed
  urlInspection:
    - url: https://example.com/
      verdict: Pass
      coverage: Submitted and indexed
      googleCanonical: https://example.com/
      robots: Allowed
      indexing: Indexing allowed
  performance:
    - page: https://example.com/
      clicks: 120
      impressions: 4300
      period: 2026-06-01/2026-08-31
    - page: https://example.com/
      query: example shoes
      clicks: 14
      impressions: 310
      period: 2026-06-01/2026-08-31
  links:
    - site: news.example.org
      count: 12
  owner: Jane Doe
  recordedAt: 2026-09-01T09:00:00Z

# bingWebmaster: what a person exports from Bing Webmaster Tools. Every
# subsection is optional; an empty list is the report saying there is nothing.
# property.verified is true or false, and verifiedAt is required when it is
# true. sitemaps rows carry the page's own status text; a sitemap listed twice
# is refused. aiCitations: how many times Bing's AI answers cited a page (a
# whole number, an http(s) page); period is the date range as exported.
bingWebmaster:
  property:
    url: https://example.com/
    verified: true
    verifiedAt: 2026-08-01T09:00:00Z
  sitemaps:
    - url: https://example.com/sitemap.xml
      submittedAt: 2026-08-02T09:00:00Z
      status: Success
  aiCitations:
    - page: https://example.com/guides/getting-started
      citations: 8
      period: 2026-06-01/2026-08-31
  owner: Jane Doe
  recordedAt: 2026-09-01T09:00:00Z

# aiBaseline (6.4): the AI visibility reports a baseline is drawn from, one row
# each. scope names the engine the number speaks for (one engine per row);
# period is the date range as exported; availableFrom is the date the tool began
# recording the report, so a period starting earlier is invented history.
aiBaseline:
  reports:
    - report: Search Console AI performance
      metric: impressions
      scope: Google
      period: 2026-09-01/2026-09-30
      availableFrom: 2026-08-31
  owner: Jane Doe
  recordedAt: 2026-10-01T09:00:00Z

# contentDecisions (7.2): what was decided for each URL whose clicks fell, one
# row per url (an http(s) address). decision is free text (refresh, merge,
# redirect, retire, keep); decidedAt is when it was made.
contentDecisions:
  - url: https://example.com/guides/old-guide
    decision: refresh
    decidedAt: 2026-09-05T09:00:00Z
    owner: Jane Doe
    recordedAt: 2026-09-05T09:00:00Z

# disavow (6.8): whether a disavow file was submitted to Google. A submission
# with no reasons or no removal attempts fails the check; with submitted: false
# there is nothing to justify. reasons and removalAttempts are lists of text.
disavow:
  submitted: true
  reasons:
    - paid links from a link network, 40 domains
  removalAttempts:
    - emailed each site owner on 2026-08-01, no reply
  owner: Jane Doe
  recordedAt: 2026-09-01T09:00:00Z

# reporting (6.3): how performance is reported and what became of the alerts.
# rhythm is free text. Each threshold's change is a signed fraction between the
# last two periods of the Search Console performance export (-0.2 is a fifth
# lost); only google can be measured from it. An anomaly with no disposition
# fails the check, and so does a crossed threshold whose metric has no anomaly.
reporting:
  rhythm: weekly
  thresholds:
    - metric: clicks
      engine: google
      change: -0.2
  anomalies:
    - metric: clicks
      disposition: seasonal dip, no action; recheck next week
  owner: Jane Doe
  recordedAt: 2026-09-01T09:00:00Z

# lighthouse (1.5, 4.5): Lighthouse JSON reports, one per URL, by file path
# (relative to this file). The engine reduces each to LCP, CLS, TBT, the LCP
# element with its loading attributes, the run time and the form factor.
# perfPolicy is the budget: thresholds (any of lcpMs, cls, tbtMs, each above
# 0), the testProfile reports must have run under (mobile or desktop), who
# owns it, and its revision (a report older than this predates the policy).
lighthouse:
  reports:
    - url: https://example.com/
      path: lighthouse/home.json
  perfPolicy:
    thresholds:
      lcpMs: 2500
      cls: 0.1
      tbtMs: 200
    testProfile: mobile
    owner: Jane Doe
    revision: 2026-08-01T00:00:00Z
  owner: Jane Doe
  recordedAt: 2026-09-01T09:00:00Z

# serverLogs (7.8): an access log in combined format, by file path (relative to
# this file). Each line is read into { at, method, path, status, userAgent };
# the query string is dropped before anything is stored, so no personal data
# in a URL is kept. Lines that are not combined format are counted and skipped.
serverLogs:
  path: logs/access.log
  owner: Jane Doe
  recordedAt: 2026-09-01T09:00:00Z

# merchantFeed (2.11): a Merchant Center feed, by file path (relative to this
# file): RSS with the g: namespace, or TSV with a header row (id, link, price,
# availability required; gtin, brand optional). Each item is read into
# { id, link, price, currency, availability, gtin, brand }. The read is strict:
# an item missing a required field, a price that is not "12.99 USD", a link
# that is not absolute or a repeated id refuses the whole file.
merchantFeed:
  path: feeds/merchant.xml
  owner: Jane Doe
  recordedAt: 2026-09-01T09:00:00Z

# checkoutMatrix (4.10): the checkout paths a person walked by hand; a crawl
# may not place an order. result is pass or fail. A failed case, or a case URL
# the crawl got a non-200 from, fails the check.
checkoutMatrix:
  cases:
    - case: guest checkout, in-stock item
      url: https://example.com/checkout
      result: pass
      testedAt: 2026-09-10T09:00:00Z
  owner: Jane Doe
  recordedAt: 2026-09-10T09:00:00Z

# contentReview (3.5): a person's review of each priority page's content, one
# row per url (an http(s) address). verdict is helpful, needs-work or fails; a
# fails verdict fails the check, as does a reviewed URL that is now 4xx or
# noindex. A crawled priority page (urlMatrix) with no review holds the check.
contentReview:
  - url: https://example.com/guides/getting-started
    reviewer: Jane Doe
    reviewedAt: 2026-09-10T09:00:00Z
    verdict: helpful

# keywordMap (0.2): which page answers which queries. One row per url (an
# http(s) address, once); purpose is text, queries a non-empty list of text. A
# mapped URL the crawl did not reach as an indexable 200 fails the check; more
# than half the indexable crawled pages with no row holds it.
keywordMap:
  - url: https://example.com/guides/getting-started
    purpose: Teach a new customer the first three steps
    queries:
      - how to get started with example

# competitorBaseline (0.1): who the site is benchmarked against. audience,
# market and language are text, competitors a list of URLs or bare hosts,
# baselineAt when the results were captured. A blank field, no competitors, or
# a competitor on the site's own host fails the check.
competitorBaseline:
  audience: Small-business owners
  market: Sweden
  language: sv
  competitors:
    - https://rival.example
  baselineAt: 2026-09-01T09:00:00Z
  owner: Jane Doe
  recordedAt: 2026-09-10T09:00:00Z

# businessProfile (2.12): the Google Business Profile. eligible is true or
# false (false needs nothing else); verification is verified, pending or
# unverified; each location's name, address and phone are what its page's
# LocalBusiness markup must agree with. Disagreement fails; pending holds.
businessProfile:
  eligible: true
  verification: verified
  locations:
    - name: Example Café
      address: Storgatan 1, 111 23 Stockholm
      phone: '+46 8 123 45 67'
      url: https://example.com/stockholm
  owner: Jane Doe
  recordedAt: 2026-09-10T09:00:00Z

# indexNow (2.10): the IndexNow key and the submissions the publishing
# pipeline made. The crawl fetches the key file once (keyLocation, else
# /<key>.txt at the origin) and it must hold the key. A logged url on another
# host fails, and so does one url sent more than five times in a UTC day.
indexNow:
  key: a1b2c3d4e5f6a7b8
  keyLocation: https://example.com/a1b2c3d4e5f6a7b8.txt
  log:
    - url: https://example.com/new-article
      sentAt: 2026-09-18T09:00:00Z
      status: 200
  owner: Jane Doe
  recordedAt: 2026-09-10T09:00:00Z

# incidents (7.1): the incident log and how often alert tests must run.
# An entry with no owner or remediation fails; so does canary.lastTestAlertAt
# older than testAlertIntervalDays. closedAt is absent while it is open.
incidents:
  testAlertIntervalDays: 30
  entries:
    - openedAt: 2026-09-01T09:00:00Z
      owner: Sam Lee
      remediation: Rolled back the release
      closedAt: 2026-09-01T11:00:00Z
  owner: Jane Doe
  recordedAt: 2026-09-10T09:00:00Z

# reviewDestinations (7.6): where the site's reputation is reviewed off-page.
# A destination whose recheckAt has passed fails; one with no owner holds the check.
reviewDestinations:
  destinations:
    - destination: Trustpilot
      policyDate: 2026-08-01T09:00:00Z
      owner: Sam Lee
      recheckAt: 2027-02-01T09:00:00Z
  owner: Jane Doe
  recordedAt: 2026-09-10T09:00:00Z

# brandEntity (0.5): how the organisation names itself. legalName and
# publicName are text; sameAs lists the profiles it stands behind (http(s)
# URLs). An Organization sameAs in the markup that is not listed here, or a
# name matching neither, fails; a listed profile missing from the markup holds.
brandEntity:
  legalName: Example Holdings AB
  publicName: Example
  sameAs:
    - https://www.linkedin.com/company/example
  owner: Jane Doe
  recordedAt: 2026-09-10T09:00:00Z

# a11yEvaluation (4.4): the manual accessibility evaluation. scope says what was
# covered; methods (at least one) and limitations are lists of text. blockers
# are barriers found, each with its WCAG criterion, URL and whether it is
# resolved; an open one fails the check. conformanceClaim is blank when none is
# made; a claim beside any critical axe violation fails the check.
a11yEvaluation:
  scope: checkout, account and the ten launch templates
  methods:
    - keyboard walk-through
    - NVDA on Firefox
  limitations:
    - no mobile screen reader pass
  blockers:
    - criterion: 2.1.1 Keyboard
      url: https://example.com/checkout
      resolved: true
  conformanceClaim: WCAG 2.2 AA
  owner: Jane Doe
  recordedAt: 2026-09-10T09:00:00Z

# crux (6.2): field Core Web Vitals, one population per source, target and
# device segment. source is crux-origin, crux-url, search-console-group or
# rum; never label one as another. lcpMs, inpMs and cls are the p75 values;
# leave one out when the source reported none (a gap, not a grade). actions
# say who acts on a metric and when it is retested; a Poor metric without
# one fails the check.
crux:
  populations:
    - source: crux-origin
      target: https://example.com
      formFactor: mobile
      periodStart: 2026-08-10
      periodEnd: 2026-09-06
      lcpMs: 2300
      inpMs: 340
      cls: 0.05
      actions:
        - metric: inp
          owner: Jane Doe
          retestAt: 2026-10-01T00:00:00Z
  owner: Jane Doe
  recordedAt: 2026-09-10T09:00:00Z

# analytics: how measurement is set up and what its numbers were checked
# against. measurementIds lists every property the site sends to.
# consentDefault is what tags do before the visitor answers the banner
# (granted or denied). events is the tagging plan: the trigger that fires
# each one and whether it should be sent or suppressed. reported puts one
# metric over one period from two different sources side by side, so the
# gap between them can be judged. All four keys are required.
analytics:
  measurementIds:
    - G-ABC123DEF4
  consentDefault: denied
  events:
    - name: purchase
      trigger: order confirmation page loads
      expect: sent
    - name: page_view
      trigger: page load before consent
      expect: suppressed
  reported:
    - metric: sessions
      period: 2026-08-01/2026-08-31
      sourceA:
        name: ga4
        value: 48200
      sourceB:
        name: server-logs
        value: 51900
      # optional: why the two differ. A gap over 10% with none fails.
      explanation: server logs count bots that GA4 filters out
  owner: Jane Doe
  recordedAt: 2026-09-10T09:00:00Z
