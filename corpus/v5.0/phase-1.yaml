- id: "1.7"
  phase: 1
  phaseLabel: "1 — Day 1 architecture"
  priority: P1
  profile: extended
  launchGate: false
  applicability:
    universal: true
    any: []
    source: >-
      All sites
  task: >-
    Infrastructure, cache policy and monitoring design
  whatToDo: >-
    Document actual hosting/CDN layers, cache keys and bypass/revalidation rules, compression, appropriate security headers and protocol choices. Cover public, excluded, private, locale and cookie/header variants. Plan invalidation and versioned assets. Inventory third-party scripts with owners and budgets. Assign monitoring owners, response targets and log needs before launch; implement and prove readiness in 4.2/4.12.
  doneWhen: >-
    Infrastructure and script choices have accountable owners and testable policies. Private responses are not shared across users; public indexing signals remain consistent through caches and edge rules. Conditional components and absent layers are explicitly recorded. Required preflight evidence is linked from 4.2 and 4.12.
  owners: ["developer"]
  ownerSource: >-
    Developer
  tools: >-
    Hosting/CDN configuration; browser network tools; HTTP probes; alert routing and runbook
  cadence:
    triggers: ["on-change"]
    source: >-
      Launch + after infra changes
  notes: >-
    Purpose: security/governance. D05/F03. Implementation and risk control, not a requirement to use a CDN or HTTP/3. Private/no-store caching rules do not replace authorization. Critical access/privacy failures block 4.2; missing monitoring readiness blocks 4.12. Sources: HTTP caching standard; HTTP cache and versioned assets; Monitoring distributed systems. Source IDs: SRC047; SRC048; SRC050; SRC051.
  automation: assisted
  remediationClass: config
  detectors: ["security-headers", "http-version", "compression-cache", "third-party-budget", "private-response-caching"]
  sources:
    - id: "SRC047"
      topic: "HTTP caching standard"
      url: "https://www.rfc-editor.org/rfc/rfc9111.html"
      usedFor: >-
        1.7, 4.2, 5.1: shared/private cache behavior, request variants and sensitive-response isolation; directives do not replace authorization.
      verified: "2026-09-09"
    - id: "SRC048"
      topic: "HTTP cache and versioned assets"
      url: "https://web.dev/articles/http-cache"
      usedFor: >-
        1.5, 1.7: cache/revalidation choices and changed asset URLs for reliable updates to returning users.
      verified: "2026-09-09"
    - id: "SRC050"
      topic: "Verify Google crawler requests"
      url: "https://developers.google.com/crawling/docs/crawlers-fetchers/verify-google-requests"
      usedFor: >-
        1.7,2.9,5.5,2.15: genuine crawler identity differs from synthetic user-agent probes; use documented DNS/IP methods before trusting crawler-only access.
      verified: "2026-09-09"
    - id: "SRC051"
      topic: "Monitoring distributed systems"
      url: "https://sre.google/sre-book/monitoring-distributed-systems/"
      usedFor: >-
        1.7, 4.12, 5.5: actionable symptoms, clear alert routing and external behavior checks; project readiness tests are an operating-policy application.
      verified: "2026-09-09"
- id: "1.8"
  phase: 1
  phaseLabel: "1 — Day 1 architecture"
  priority: P0
  profile: core
  launchGate: true
  applicability:
    universal: true
    any: []
    source: >-
      All sites
  task: >-
    Staging and preview environment protection
  whatToDo: >-
    Password-protect or IP-restrict staging and preview environments. Use environment-conditional robots/meta controls as defense in depth and automated tests to ensure staging noindex rules cannot ship to production.
  doneWhen: >-
    Staging and preview environments require effective access control. For production, every URL pattern approved as indexable is crawlable and has no unintended noindex in the response headers or HTML. Every intentionally excluded public pattern retains the approved indexing directives, and every private pattern retains effective authorization. The environment-specific URL matrix, including both indexable and excluded examples, matches the observed raw and rendered behavior. The preflight evidence proves these rules on the release candidate; the applicable launch-day checks confirm them on production after cutover.
  owners: ["developer"]
  ownerSource: >-
    Developer
  tools: >-
    Host auth/basic auth; env vars; robots.txt; meta robots; Search Console
  cadence:
    triggers: ["before-launch"]
    source: >-
      Go-live checklist; every new environment
  notes: >-
    Purpose: indexing/discovery; security/governance. Do not remove intentional noindex from internal-search or other deliberately excluded public pages. Robots.txt is not confidentiality or guaranteed deindexing; preserve crawl access where needed to read a relied-upon noindex. Production verification belongs to the live checks in Phase 5. Test both allowed and excluded patterns; never treat a clean indexable homepage as proof for the whole matrix. Source IDs: SRC009; SRC038; SRC094.
  automation: assisted
  remediationClass: config
  detectors: ["staging-protection"]
  sources:
    - id: "SRC009"
      topic: "Robots meta and X-Robots-Tag"
      url: "https://developers.google.com/search/docs/crawling-indexing/robots-meta-tag"
      usedFor: >-
        B03 and 0.3, 1.10, 1.16: intentional noindex needs crawl access; headers cover non-HTML files. Directives do not replace authorization.
      verified: "2026-09-08"
    - id: "SRC038"
      topic: "JavaScript SEO basics"
      url: "https://developers.google.com/search/docs/crawling-indexing/javascript/javascript-seo-basics"
      usedFor: >-
        1.1, 1.10: rendering, raw noindex, canonical consistency and crawlable output; SSR is a reliability policy.
      verified: "2026-09-08"
    - id: "SRC094"
      topic: "Google technical requirements"
      url: "https://developers.google.com/search/docs/essentials/technical"
      usedFor: >-
        E02: basic technical indexing eligibility is distinct from project release dependencies; indexing is not guaranteed.
      verified: "2026-09-10"
