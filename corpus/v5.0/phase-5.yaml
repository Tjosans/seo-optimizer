- id: "5.1"
  phase: 5
  phaseLabel: "5 — Launch day"
  priority: P0
  profile: core
  launchGate: true
  applicability:
    universal: true
    any: []
    source: >-
      All sites
  task: >-
    DNS cutover and production smoke test
  whatToDo: >-
    After cutover test the public hostname: DNS, certificates, preferred host, statuses, robots, sitemap, canonicals, assets, forms and critical journeys. Repeat 4.2's applicable cold/warm cache, invalidation, locale and private-session checks on production. Check edge challenges/rate limits and required resources. Use available provider-triggered tools and verified request logs; identify the actual crawler/fetcher category observed.
  doneWhen: >-
    Production matches the approved matrix with no critical availability, indexing, required-access or privacy defect. Record public-path probes and verified provider requests separately. Mark an unobserved organic crawl Unavailable in evidence, with an owner and first-week follow-up in 6.1; do not claim verification or failure solely because no visit has occurred. Known required-access failures block acceptance.
  owners: ["developer", "seo"]
  ownerSource: >-
    Developer + SEO
  tools: >-
    Browser; HTTP probes; provider live-fetch tools; trusted edge/server logs; provider identity verification
  cadence:
    triggers: ["launch-day"]
    source: >-
      Launch day
  notes: >-
    Purpose: indexing/discovery; security/governance. D05. A spoofed user agent tests a rule only. Verify Google requests with the correct published IP category or reverse DNS plus forward match and an exact official domain boundary. A user-triggered fetch does not prove common Googlebot access. Never let bot identity bypass private-account authorization. Source: Verify Google crawler requests. Source IDs: SRC047; SRC050.
  automation: assisted
  remediationClass: config
  detectors: ["production-smoke-test"]
  sources:
    - id: "SRC047"
      topic: "HTTP caching standard"
      url: "https://www.rfc-editor.org/rfc/rfc9111.html"
      usedFor: >-
        1.7, 4.2, 5.1: shared/private cache behavior, request variants and sensitive-response isolation; directives do not replace authorization.
      verified: "2026-09-09"
    - id: "SRC050"
      topic: "Verify Google crawler requests"
      url: "https://developers.google.com/crawling/docs/crawlers-fetchers/verify-google-requests"
      usedFor: >-
        1.7,2.9,5.5,2.15: genuine crawler identity differs from synthetic user-agent probes; use documented DNS/IP methods before trusting crawler-only access.
      verified: "2026-09-09"
- id: "5.2"
  phase: 5
  phaseLabel: "5 — Launch day"
  priority: P0
  profile: core
  launchGate: true
  applicability:
    universal: false
    any: ["migration"]
    source: >-
      Migration / redesign / domain or URL change
  task: >-
    Migration cutover and live redirect verification
  whatToDo: >-
    After destination readiness and 4.8 pass, activate the approved redirects at the planned cutover. Test every inventoried live status/target and the approved content/SEO-signal sample, including host/query variants and assets. Then submit eligible Change of Address requests from the required verified source variants using the owning account. Record tool outcomes, retain domain/redirect continuity and hand monitoring to the named owner.
  doneWhen: >-
    Live outcomes match the approved map, including intentional 404/410 retirements and relevant consolidations. No required destination, mapping or signal check fails. Eligible Change of Address requests have passed required prechecks and show the move in progress; ineligible cases have a recorded reason. Old domains/variants remain controlled and monitored under 0.8. A submission does not prove indexing or ranking recovery.
  owners: ["developer", "seo"]
  ownerSource: >-
    Developer + SEO
  tools: >-
    Old-site crawl; redirect tester; GSC
  cadence:
    triggers: ["cutover"]
    source: >-
      At cutover and immediately afterward; monitor through migration
  notes: >-
    Purpose: indexing/discovery; security/governance. C21. Prepare destinations before cutover; submit Change of Address only after the site is moved and redirects work. The tool's 180-day effect does not shorten the at-least-one-year redirect policy. Sources: Google site moves; Change of Address. Source IDs: SRC011; SRC059.
  automation: assisted
  remediationClass: config
  detectors: ["migration-redirects-live"]
  sources:
    - id: "SRC011"
      topic: "Google site moves"
      url: "https://developers.google.com/search/docs/crawling-indexing/site-move-with-url-changes"
      usedFor: >-
        0.8, 4.8, 5.2: domain history, URL outcomes, destination/redirect sequencing and at-least-one-year redirect guidance. Keep the tool's separate 180-day effect distinct.
      verified: "2026-09-09"
    - id: "SRC059"
      topic: "Change of Address"
      url: "https://support.google.com/webmasters/answer/9370220"
      usedFor: >-
        0.8, 4.8, 5.2: eligible/excluded moves, same-account ownership, source property/variant scope and submission after live redirects; tool effect is 180 days.
      verified: "2026-09-09"
