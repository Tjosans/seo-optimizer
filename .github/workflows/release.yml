name: Release

# Ships the desktop app. Every push to master asks one question: does the
# version in package.json have a GitHub release yet? If not, the Windows
# installer is built and published as release v<version>, and every installed
# copy of SEO Optimizer finds it on its next update check, downloads it in the
# background and restarts into it. Shipping an update is therefore:
#
#     npm version patch --no-git-tag-version   # in a PR, merged to master
#
# A push that leaves the version alone releases nothing.

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Is this version released?
        id: version
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if gh release view "v$version" >/dev/null 2>&1; then
            echo "v$version is already released; nothing to do."
            echo "released=true" >> "$GITHUB_OUTPUT"
          else
            echo "released=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.version.outputs.released == 'false'
        with:
          node-version: 24
          cache: npm

      - if: steps.version.outputs.released == 'false'
        run: npm ci

      - name: Build and publish v${{ steps.version.outputs.version }}
        if: steps.version.outputs.released == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: npm run release -w @seo/desktop
