- id: "4.7"
  phase: 4
  phaseLabel: "4 — Pre-launch QA"
  priority: P0
  profile: core
  launchGate: true
  applicability:
    universal: false
    any: ["analytics", "consent"]
    source: >-
      Sites using analytics, conversion tags or consent controls
  task: >-
    Analytics, conversion and consent QA matrix
  whatToDo: >-
    Execute the 0.4 matrix across applicable consent states, direct/organic/campaign entry, initial loads, client routes, back/forward, forms/errors and payment returns. Repeat confirmations to test duplicate or empty/reused transaction IDs; failed/abandoned transactions must not count as completed purchases. Inspect storage and outgoing URLs, titles, event/user fields and in-scope server/vendor forwarding for prohibited data. Reconcile allowed test outcomes with the system of record.
  doneWhen: >-
    Every required case has dated release-specific evidence matching expected collection or suppression, consent timing, values and attribution. Required events are not missing or duplicated; prohibited payloads and unintended referrals are absent. All blocking defects are corrected and retested; an owner/date alone is insufficient. Record reporting delay and unavailable diagnostics honestly; do not require unconsented users or suppressed events to appear in analytics.
  owners: ["analytics", "developer", "privacy"]
  ownerSource: >-
    Analytics + privacy + developer
  tools: >-
    Analytics debugger; Tag Assistant; network/storage tools
  cadence:
    triggers: ["before-launch"]
    source: >-
      Immediately before launch
  notes: >-
    Purpose: measurement; legal/accessibility. C13/D06. Test actual payloads even with CMP approval or best-effort platform redaction enabled. Hashing alone does not authorize a prohibited field. Optional links and unavailable historical data are not universal gates; a missing required test remains incomplete. Sources: Consent Mode implementation timing; Analytics PII prevention; GA4 SPA measurement; GA4 transaction IDs; GA4 cross-domain measurement. Source IDs: SRC064; SRC065; SRC066; SRC067; SRC069.
  automation: assisted
  remediationClass: config
  detectors: ["analytics-consent-matrix"]
  sources:
    - id: "SRC064"
      topic: "Consent Mode implementation timing"
      url: "https://developers.google.com/tag-platform/security/guides/consent"
      usedFor: >-
        2.6, 4.7: defaults before config/events, updates before page transitions, choice persistence and withdrawal; validate the actual implementation.
      verified: "2026-09-09"
    - id: "SRC065"
      topic: "Analytics PII prevention"
      url: "https://support.google.com/analytics/answer/6366371"
      usedFor: >-
        2.5, 4.7, 5.6: remove prohibited identifiers from URLs, titles and collected fields; redaction settings are not complete payload verification.
      verified: "2026-09-09"
    - id: "SRC066"
      topic: "GA4 SPA measurement"
      url: "https://developers.google.com/analytics/devguides/collection/ga4/single-page-applications"
      usedFor: >-
        2.5, 4.7: deliberate virtual-pageview emission, avoid double tracking, inspect current page_location/page_referrer and navigation behavior.
      verified: "2026-09-09"
    - id: "SRC067"
      topic: "GA4 transaction IDs"
      url: "https://support.google.com/analytics/answer/12313109"
      usedFor: >-
        2.5, 4.7, 5.6: web purchase deduplication needs unique nonempty transaction IDs without customer-identifying data; avoid reused IDs and generic deduplication claims.
      verified: "2026-09-09"
    - id: "SRC069"
      topic: "GA4 cross-domain measurement"
      url: "https://support.google.com/analytics/answer/10071811?hl=en"
      usedFor: >-
        2.5, 4.7: selected cross-domain journeys use consistent configuration; verify destination functionality and preserved linker parameters through redirects.
      verified: "2026-09-09"
- id: "4.8"
  phase: 4
  phaseLabel: "4 — Pre-launch QA"
  priority: P0
  profile: core
  launchGate: true
  applicability:
    universal: false
    any: ["migration"]
