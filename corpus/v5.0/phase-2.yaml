    source: >-
      E-commerce / product catalogue
  task: >-
    Product, merchant and variant configuration by scope
  whatToDo: >-
    Record separate decisions for direct sales, product information, variants, chosen product markup, Merchant Center and checkout. Configure applicable prices, availability, currency, genuine identifiers, shipping/returns and variant URLs from the actual catalogue. Use Product snippets or merchant listing requirements for the intended surface; merchant listings require on-site purchase. Link selected feed/page/markup sources and test their agreement. Never fabricate ratings or present business testimonials as product reviews.
  doneWhen: >-
    Every submodule decision is resolved and applicable configuration is accurate. Selected variants have stable unique identities and directly selectable URLs showing the correct state. Shipped markup passes 4.6 and multiple data sources agree. Absent checkout/feed/optional markup does not fail a module that explicitly excludes it. Review authenticity and destination rules are recorded under 3.13/7.6; no fabricated review data is accepted.
  owners: ["developer", "business"]
  ownerSource: >-
    Developer + business
  tools: >-
    Catalogue/source data; applicable feature validator; Merchant Center if used; page/feed comparison
  cadence:
    triggers: ["before-launch"]
    source: >-
      Before launch; every catalogue/template change
  notes: >-
    Purpose: search-feature eligibility; security/governance; legal/accessibility. C10. Conditional commercial accuracy and chosen-feature configuration. Product snippets, merchant listings and Merchant Center are distinct decisions. Follow the chosen single-page or multi-page ProductGroup canonical model; do not force all variants to one canonical. Sources: Product structured data; Merchant listing requirements; Product variants. Source IDs: SRC072; SRC073; SRC074; SRC083.
  automation: assisted
  remediationClass: code
  detectors: ["product-schema", "merchant-feed-parity"]
  sources:
    - id: "SRC072"
      topic: "Product structured data"
      url: "https://developers.google.com/search/docs/appearance/structured-data/product"
      usedFor: >-
        2.11,4.10: distinct product snippets, merchant listings and Merchant Center choices; accuracy and chosen-surface requirements.
      verified: "2026-09-09"
    - id: "SRC073"
      topic: "Merchant listing requirements"
      url: "https://developers.google.com/search/docs/appearance/structured-data/merchant-listing"
      usedFor: >-
        2.11,4.10: purchasable product pages, offer data, currency-specific URLs and required versus recommended properties; not every catalogue has checkout.
      verified: "2026-09-09"
    - id: "SRC074"
      topic: "Product variants"
      url: "https://developers.google.com/search/docs/appearance/structured-data/product-variants"
      usedFor: >-
        2.11,4.10: variant/group IDs, direct variant selection, correct image/offer/cart state and distinct single-page versus multi-page canonical models.
      verified: "2026-09-09"
    - id: "SRC083"
      topic: "Review snippet guidelines"
      url: "https://developers.google.com/search/docs/appearance/structured-data/review-snippet"
      usedFor: >-
        2.11,3.13,4.6,7.6: visible genuine item-specific reviews; no imported aggregates; self-serving Organization/LocalBusiness star restriction includes widgets and is distinct from eligible Product reviews.
      verified: "2026-09-09"
- id: "2.12"
  phase: 2
  phaseLabel: "2 — Pre-launch config"
  priority: P1
  profile: core
  launchGate: false
  applicability:
    universal: false
    any: ["local-business"]
    source: >-
      Local businesses
  task: >-
    Google Business Profile and local entity setup
  whatToDo: >-
    Confirm Business Profile eligibility before creating or claiming a listing. Use the real business name, eligible customer-facing location or service area, correct address visibility and controlled ownership. Resolve duplicates under current location/practitioner rules. Keep hours, categories, contact details and the corresponding location page accurate. Use a tagged website link only under the measurement policy.
  doneWhen: >-
    The eligibility decision and accountable owner are recorded. Eligible profile configuration and location-page details agree. Record actual verification state and open dependencies with an owner and next check; do not label pending verification complete. Ineligible businesses do not create a profile. Profile verification is not a universal website-launch dependency.
  owners: ["business", "seo"]
  ownerSource: >-
    Business / SEO
  tools: >-
    Google Business Profile
  cadence:
    triggers: ["on-change"]
    windowDays: 30
    source: >-
      Eligibility before listing creation; launch/first 30 days follow-up; after business changes
  notes: >-
    Purpose: search-feature eligibility; optional enhancement. C11. Conditional local presence, not a universal gate. Business eligibility and exceptions follow current Google Business Profile rules. Review solicitation is governed separately under 3.13/7.6. Source: Business Profile representation guidelines. Source IDs: SRC075.
  automation: assisted
  remediationClass: config
  detectors: ["gbp-setup"]
  sources:
    - id: "SRC075"
      topic: "Business Profile representation guidelines"
      url: "https://support.google.com/business/answer/3038177?hl=en"
