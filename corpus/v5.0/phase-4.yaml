- id: "4.1"
  phase: 4
  phaseLabel: "4 — Pre-launch QA"
  priority: P0
  profile: core
  launchGate: true
  applicability:
    universal: true
    any: []
    source: >-
      All sites
  task: >-
    Full staging crawl: raw HTML and rendered output
  whatToDo: >-
    Crawl the release candidate before launch with raw-HTML and JavaScript rendering modes for status codes, titles, headings, canonicals, directives, links, assets and orphan detection. Production crawling is a separate launch-day row.
  doneWhen: >-
    No unexplained critical difference exists between raw and rendered output; priority URLs have no broken links, missing metadata or indexation conflicts.
  owners: ["developer", "seo"]
  ownerSource: >-
    SEO + developer
  tools: >-
    Screaming Frog (JS rendered); Sitebulb
  cadence:
    triggers: ["before-launch", "on-change"]
    source: >-
      Before launch and after big releases
  notes: >-
    Purpose: indexing/discovery. v4: split staging QA from the production crawl. Source IDs: SRC009; SRC010; SRC038; SRC039.
  automation: automated
  remediationClass: code
  detectors: ["raw-rendered-crawl-diff", "broken-links", "metadata-completeness"]
  sources:
    - id: "SRC009"
      topic: "Robots meta and X-Robots-Tag"
      url: "https://developers.google.com/search/docs/crawling-indexing/robots-meta-tag"
      usedFor: >-
        B03 and 0.3, 1.10, 1.16: intentional noindex needs crawl access; headers cover non-HTML files. Directives do not replace authorization.
      verified: "2026-09-08"
    - id: "SRC010"
      topic: "Canonicalization"
      url: "https://developers.google.com/search/docs/crawling-indexing/consolidate-duplicate-urls"
      usedFor: >-
        1.3, 1.6, 1.16: retained duplicates, preferred-URL signals, supported non-HTML Link canonical; selection is not guaranteed.
      verified: "2026-09-08"
    - id: "SRC038"
      topic: "JavaScript SEO basics"
      url: "https://developers.google.com/search/docs/crawling-indexing/javascript/javascript-seo-basics"
      usedFor: >-
        1.1, 1.10: rendering, raw noindex, canonical consistency and crawlable output; SSR is a reliability policy.
      verified: "2026-09-08"
    - id: "SRC039"
      topic: "JavaScript troubleshooting"
      url: "https://developers.google.com/search/docs/crawling-indexing/javascript/fix-search-javascript"
      usedFor: >-
        1.1: renderer limitations, resource/API access and reproducible raw/rendered diagnostics.
      verified: "2026-09-08"
- id: "4.2"
  phase: 4
  phaseLabel: "4 — Pre-launch QA"
  priority: P0
  profile: extended
  launchGate: true
  applicability:
    universal: true
    any: []
    source: >-
      All sites
  task: >-
    Indexability and edge-access matrix reconciliation
  whatToDo: >-
    Compare the release candidate with 0.3 for status, directives, canonical, sitemap, links and locale. On an approved production-equivalent path, test actual cache layers cold/warm and after invalidation, relevant cookies/headers/locales, separate users and private-route authorization. Check intended crawler/visitor rules, challenges, rate limits and essential rendering resources. Record intentional staging access differences for 5.1 live confirmation.
  doneWhen: >-
    Every launch pattern meets the approved matrix and current acceptance criteria across tested cache/access variants. No private cross-user response leak, stale indexing directive, wrong locale, or blocked required resource remains. Missing infrastructure layers are documented. Unresolved mismatches fail; an approved policy change requires matrix/criteria revision and retesting, not a Passed waiver.
  owners: ["developer", "seo"]
  ownerSource: >-
    SEO + developer
  tools: >-
    Crawler export; URL matrix; cold/warm HTTP and browser probes; cache configuration; trusted logs
  cadence:
    triggers: ["before-launch"]
    source: >-
      Immediately before launch
  notes: >-
    Purpose: indexing/discovery; security/governance. D05. This existing P0 gate owns applicable cache, WAF and privacy acceptance before cutover; 1.7 holds design evidence. It cannot prove an unobserved external crawler visit. Production path and genuine request observations follow in 5.1/6.1. Sources: HTTP caching standard; Verify Google crawler requests. Source IDs: SRC047; SRC050.
  automation: assisted
  remediationClass: config
  detectors: ["indexability-matrix-reconciliation"]
  sources:
    - id: "SRC047"
      topic: "HTTP caching standard"
      url: "https://www.rfc-editor.org/rfc/rfc9111.html"
      usedFor: >-
        1.7, 4.2, 5.1: shared/private cache behavior, request variants and sensitive-response isolation; directives do not replace authorization.
      verified: "2026-09-09"
    - id: "SRC050"
      topic: "Verify Google crawler requests"
      url: "https://developers.google.com/crawling/docs/crawlers-fetchers/verify-google-requests"
      usedFor: >-
        1.7,2.9,5.5,2.15: genuine crawler identity differs from synthetic user-agent probes; use documented DNS/IP methods before trusting crawler-only access.
      verified: "2026-09-09"
- id: "4.3"
  phase: 4
  phaseLabel: "4 — Pre-launch QA"
  priority: P0
  profile: core
  launchGate: true
  applicability:
    universal: true
    any: []
    source: >-
      All sites
  task: >-
    Mobile content parity and critical-journey QA
  whatToDo: >-
    Test the declared template/journey matrix on representative real phones and with a keyboard. Compare mobile/desktop primary content, headings, crawlable links, robots directives, metadata, canonicals/hreflang and relevant structured data; account for intentional separate-URL relationships. Required content/media must be available without crawler interaction. Test applicable forms, errors, labels, focus, contrast, targets, zoom, navigation and consent/banner states; link 4.4 accessibility evidence.
  doneWhen: >-
    The complete approved matrix passes, including usable forms and keyboard/focus/error/zoom states where present. Mobile exposes equivalent essential content and correct signals/resources; no interaction-only loading, accidental mobile exclusion or blocking overlay remains. Separate mobile URLs map correctly. A different layout is acceptable when content and access requirements still pass.
  owners: ["developer", "designer"]
  ownerSource: >-
    Designer + developer
  tools: >-
    Representative real phones; browser network/DOM tools; keyboard; linked accessibility evidence
  cadence:
    triggers: []
    source: >-
      Launch
  notes: >-
    Purpose: indexing/discovery; legal/accessibility. C18. Apply 1.1 rendering checks to the mobile output used for indexing. Responsive layout or an automated score alone does not prove content parity or journey access. Existing content in accessible tabs/accordions can be valid; fetching required content only after a click is different. Sources: Mobile-first indexing; Accessibility evaluation. Source IDs: SRC015; SRC058.
  automation: assisted
  remediationClass: code
  detectors: ["mobile-journey-qa"]
  sources:
    - id: "SRC015"
      topic: "Accessibility evaluation"
      url: "https://www.w3.org/WAI/test-evaluate/"
      usedFor: >-
        0.9, 4.3, 4.4: early assessment with knowledgeable human evaluation; tools alone cannot establish accessibility conformance.
      verified: "2026-09-09"
    - id: "SRC058"
      topic: "Mobile-first indexing"
      url: "https://developers.google.com/search/docs/crawling-indexing/mobile/mobile-sites-mobile-first-indexing"
      usedFor: >-
        4.3: mobile primary content, directives, metadata, structured data and resources; no interaction-dependent primary loading; correct separate-URL relationships.
      verified: "2026-09-09"
- id: "4.4"
  phase: 4
  phaseLabel: "4 — Pre-launch QA"
  priority: P0
  profile: extended
  launchGate: true
  applicability:
    universal: true
    any: []
    source: >-
      All sites; conformance target follows the 0.9 scope
  task: >-
    Accessibility assessment against the approved target
  whatToDo: >-
    Assess the version/level and scope approved in 0.9 using automated tools and knowledgeable human evaluation. Cover keyboard/focus, screen-reader use, names/roles, reflow/zoom, forms/errors, landmarks/dialogs, motion, captions and status messages as applicable. Record tested pages and complete processes, technologies, unmet criteria, severity, owners and remediation dates. Limit conclusions to the evidence actually collected.
  doneWhen: >-
    All release-blocking access and obligation criteria in 0.9 are satisfied; unresolved blockers remain failed. The assessment records scope, methods, limitations and remaining actions. Make a conformance claim only when evidence satisfies the applicable conformance requirements, including full pages, complete processes, accessibility-supported use and non-interference. A tool score or representative sample alone is insufficient.
  owners: ["accessibility", "developer", "designer"]
  ownerSource: >-
    Accessibility + designer + developer
  tools: >-
    axe; Lighthouse; keyboard; screen reader; WCAG checklist; Sources sheet
  cadence:
    triggers: ["before-launch", "on-change"]
    source: >-
      Before launch and after critical UI changes
  notes: >-
    Purpose: legal/accessibility. C19. Assessment is not automatically a conformance claim. If conformance is itself a blocking obligation, missing proof remains unresolved; an owner/date is not a waiver. Legal scope is reviewed through 0.9. Sources: WCAG 2.2, section 5; Accessibility evaluation. Source IDs: SRC014; SRC015.
  automation: assisted
  remediationClass: code
  detectors: ["axe-accessibility", "manual-a11y-evaluation"]
  sources:
    - id: "SRC014"
      topic: "WCAG 2.2"
      url: "https://www.w3.org/TR/WCAG22/"
      usedFor: >-
        0.9, 4.4: declared target and conformance requirements, including full pages/processes, supported use and non-interference; qualified scope determines obligations.
      verified: "2026-09-09"
    - id: "SRC015"
      topic: "Accessibility evaluation"
      url: "https://www.w3.org/WAI/test-evaluate/"
      usedFor: >-
        0.9, 4.3, 4.4: early assessment with knowledgeable human evaluation; tools alone cannot establish accessibility conformance.
      verified: "2026-09-09"
- id: "4.5"
  phase: 4
  phaseLabel: "4 — Pre-launch QA"
  priority: P0
  profile: core
  launchGate: true
  applicability:
    universal: true
    any: []
    source: >-
      All sites
  task: >-
    Representative-template lab performance QA
  whatToDo: >-
    Run the frozen 1.5 profile on the homepage, every major launch template and relevant interactions. Record the release, tool/version, devices, network, cache state, repeated runs and agreed summary. Inspect LCP discovery, layout shifts, main-thread work, fonts and third-party code. Compare launch thresholds and diagnostic targets separately; investigate variance instead of selecting only the best run.
  doneWhen: >-
    Every launch template passes the current approved acceptance criteria with reproducible evidence. Diagnostic overruns have impact, owner and remediation date. A failed threshold is not Passed by a signed exception. If criteria change, record approval and a new revision, then re-evaluate; stale evidence cannot authorize the revised release.
  owners: ["developer"]
  ownerSource: >-
    Developer + performance owner
  tools: >-
    Lighthouse CI; WebPageTest; browser performance panel
  cadence:
    triggers: ["every-release", "before-launch"]
    source: >-
      Before launch and major releases
  notes: >-
    Purpose: measurement; security/governance. C08. A passing lab budget is pre-launch engineering evidence, not a field CWV result. Lighthouse TBT may help diagnose responsiveness; interaction tests in a lab still do not replace real-user INP. Sources: Web Vitals metrics; Lab versus field data. Source IDs: SRC006; SRC053; SRC092.
  automation: assisted
  remediationClass: code
  detectors: ["template-lab-perf"]
  sources:
    - id: "SRC006"
      topic: "Lab versus field data"
      url: "https://web.dev/articles/lab-and-field-data-differences"
      usedFor: >-
        1.5, 4.5, 4.11: controlled lab profiles versus real-user distributions; results and populations are not interchangeable.
      verified: "2026-09-09"
    - id: "SRC053"
      topic: "Web Vitals metrics"
      url: "https://web.dev/articles/vitals"
      usedFor: >-
        1.5, 4.5, 6.2: LCP/INP/CLS at p75 by device; Good <=2.5 s/200 ms/0.1; TBT lab diagnostics do not replace field INP.
      verified: "2026-09-09"
    - id: "SRC092"
      topic: "INP historical date"
      url: "https://web.dev/blog/responsiveness"
      usedFor: >-
        H07 source correction for 4.5/6.2: the page's current notice states INP replaced FID on 2024-03-12. Retain current metric controls; do not describe this as an August/September 2026 launch rule.
      verified: "2026-09-09"
- id: "4.6"
  phase: 4
  phaseLabel: "4 — Pre-launch QA"
