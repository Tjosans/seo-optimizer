- id: "0.2"
  phase: 0
  phaseLabel: "0 — Discovery & strategy"
  priority: P1
  profile: core
  launchGate: false
  applicability:
    universal: true
    any: []
    source: >-
      All sites
  task: >-
    Keyword and intent mapping
  whatToDo: >-
    Map priority search landing pages to their main user need, relevant query cluster, intent and business role before architecture decisions. Include navigational intent where relevant. Assign other URL patterns their functional purpose and indexability decision under 0.3. Document a meaningful outcome where useful rather than forcing every URL into a conversion target.
  doneWhen: >-
    Priority search pages have a documented purpose and query/intent mapping. Utility, private and other functional routes are accounted for in 0.3 without artificial keyword or conversion assignments. Use the mapping to guide architecture and content decisions, then refine it with actual search evidence after launch.
  owners: ["content", "seo"]
  ownerSource: >-
    SEO / content
  tools: >-
    Keyword research tools; Search Console later
  cadence:
    triggers: ["before-build", "once"]
    source: >-
      Once before build; update when adding pages
  notes: >-
    Purpose: relevance/ranking consideration. C01. Strategy and relevance planning; P1 and nongating. The URL-purpose/indexability contract remains in 0.3. Source: Helpful content. Source IDs: SRC033.
  automation: assisted
  remediationClass: content
  detectors: ["keyword-intent-map"]
  sources:
    - id: "SRC033"
      topic: "Helpful content"
      url: "https://developers.google.com/search/docs/fundamentals/creating-helpful-content"
      usedFor: >-
        0.2,3.5,3.10: real user purpose, original value, supported claims and contextual authorship/creation transparency; formatting alone does not establish quality.
      verified: "2026-09-09"
- id: "0.3"
  phase: 0
  phaseLabel: "0 — Discovery & strategy"
  priority: P0
  profile: core
  launchGate: true
  applicability:
    universal: true
    any: []
    source: >-
      All sites
  task: >-
    Information architecture, URL inventory and indexability matrix
  whatToDo: >-
    Inventory planned CMS, API-generated and uploaded URL patterns before implementation, including public indexable pages, excluded search/tag/filter/feed/file patterns and private routes. Record template, intent, parent/discovery links, status, indexability/directives, canonical, sitemap decision, locale and launch criticality. Reconcile to actual routes and uploaded assets.
  doneWhen: >-
    The approved matrix covers every planned pattern and priority URL, including intentional exclusions and non-HTML files. Each has consistent status, access, indexing, canonical and discovery rules; private data requires authorization.
  owners: ["developer", "seo"]
  ownerSource: >-
    SEO + developer
  tools: >-
    Spreadsheet / repo doc
  cadence:
    triggers: []
    source: >-
      Update whenever a page type is added
  notes: >-
    Purpose: indexing/discovery; security/governance. C05. The matrix drives later QA. robots.txt does not make data private or guarantee removal. Sources: Robots meta and X-Robots-Tag; Googlebot fetch limits. Source IDs: SRC009; SRC010; SRC040; SRC045; SRC103.
  automation: assisted
  remediationClass: config
  detectors: ["url-inventory-builder"]
  sources:
    - id: "SRC009"
      topic: "Robots meta and X-Robots-Tag"
      url: "https://developers.google.com/search/docs/crawling-indexing/robots-meta-tag"
      usedFor: >-
        B03 and 0.3, 1.10, 1.16: intentional noindex needs crawl access; headers cover non-HTML files. Directives do not replace authorization.
      verified: "2026-09-08"
    - id: "SRC010"
      topic: "Canonicalization"
      url: "https://developers.google.com/search/docs/crawling-indexing/consolidate-duplicate-urls"
      usedFor: >-
        1.3, 1.6, 1.16: retained duplicates, preferred-URL signals, supported non-HTML Link canonical; selection is not guaranteed.
      verified: "2026-09-08"
    - id: "SRC040"
      topic: "Googlebot fetch limits"
      url: "https://developers.google.com/search/docs/crawling-indexing/googlebot"
      usedFor: >-
        1.1, 1.5, 0.3: uncompressed per-file fetch caps; Search: 2 MB non-PDF, 64 MB PDF; separate resources. Reverify with crawler/payload changes.
      verified: "2026-09-08"
    - id: "SRC045"
      topic: "Sitemap construction"
      url: "https://developers.google.com/search/docs/crawling-indexing/sitemaps/build-sitemap"
      usedFor: >-
        2.1: UTF-8, escaping, absolute URLs, 50,000 URL/50 MB uncompressed limits and meaningful lastmod.
      verified: "2026-09-08"
    - id: "SRC103"
      topic: "Crawlable links and anchor text"
      url: "https://developers.google.com/search/docs/crawling-indexing/links-crawlable"
      usedFor: >-
        1.2 / 3.3: crawlable anchors and href attributes, descriptive contextual links and links to important pages. Few clicks is a project usability target, not a numeric Google rule.
      verified: "2026-09-10"
- id: "0.4"
  phase: 0
  phaseLabel: "0 — Discovery & strategy"
  priority: P0
  profile: core
  launchGate: true
  applicability:
    universal: true
    any: []
    source: >-
      All sites
  task: >-
    Measurement scope and success plan
  whatToDo: >-
    Approve the measurement purpose, business outcomes, reporting owner and chosen tools, or a documented no-tracking decision. For selected instrumentation define events/key events, trigger and deduplication rules, attribution scope and expected collection or suppression by consent/journey state. Specify required receipt evidence and reporting latency. Link the qualified privacy/vendor decision in 0.9 and record measurement limitations before implementation.
  doneWhen: >-
    A dated owner decision defines the measurement scope and success criteria, including any no-tracking choice. Selected events, consent expectations, validation methods and review owners are explicit. Resolve 2.5, 2.6, 4.7 and 5.6 independently from that scope; no tool, conversion event or cross-product association is required merely to complete this plan.
  owners: ["business", "seo"]
  ownerSource: >-
    Business + SEO
  tools: >-
    Measurement plan; privacy/vendor decisions; chosen-platform documentation
  cadence:
    triggers: ["before-build"]
    source: >-
      At strategy; verify at launch
  notes: >-
    Purpose: measurement; security/governance. C12. Measurement is a business/governance control, not a ranking requirement. A no-analytics choice does not decide consent for other tags or vendors. Sources: Google Consent Mode; Search Console and GA4 linking. Source IDs: SRC004; SRC068.
  automation: attested
  remediationClass: config
  detectors: []
  sources:
