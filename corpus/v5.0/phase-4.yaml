    triggers: ["before-launch"]
    source: >-
      Before launch and catalogue platform changes
  notes: >-
    Purpose: security/governance; search-feature eligibility; legal/accessibility. C10. Conditional QA of actual commercial functions. Follow required versus recommended feature properties under 2.7/4.6. Review rules remain separate under 3.13/7.6. Sources: Product structured data; Merchant listing requirements; Product variants. Source IDs: SRC072; SRC073; SRC074.
