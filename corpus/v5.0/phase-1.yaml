    any: ["faceted-nav"]
    source: >-
      Large catalogues / faceted navigation
  task: >-
    Faceted-navigation and parameter URL controls
  whatToDo: >-
    Choose useful indexable filter combinations. Define deterministic parameter order and bound discovery of unwanted combinations. Test repeated/invalid parameters, no-result or nonsensical combinations and out-of-range pages. Use real 404 responses for nonexistent states; keep crawl restrictions separate from deindexing and canonicalization decisions.
  doneWhen: >-
    Approved filter pages are useful, accessible and linked. Unwanted combinations do not create uncontrolled crawl paths or enter ordinary sitemaps. Negative fixtures return the documented errors. Any noindex relied on for removal remains readable; robots blocking is justified separately.
  owners: ["developer", "seo"]
  ownerSource: >-
    Developer + SEO
  tools: >-
    Screaming Frog; GSC
  cadence:
    triggers: ["on-feature-ship"]
    source: >-
      When filters ship
  notes: >-
    Purpose: indexing/discovery. C06. Source: Faceted navigation. Test absent results and duplicate filters at their actual URLs; do not redirect all such states to one common error URL. Source IDs: SRC043.
  automation: automated
  remediationClass: structural
  detectors: ["faceted-nav-control", "parameter-crawl-space"]
  sources:
    - id: "SRC043"
      topic: "Faceted navigation"
      url: "https://developers.google.com/crawling/docs/faceted-navigation"
      usedFor: >-
        1.12, 1.4: bounded crawl spaces, stable filters and 404 for no-result/nonsensical filters and nonexistent pages.
      verified: "2026-09-08"
- id: "1.13"
  phase: 1
  phaseLabel: "1 — Day 1 architecture"
  priority: P0
  profile: core
  launchGate: true
  applicability:
    universal: false
    any: ["pagination"]
    source: >-
      Long listings / pagination / infinite scroll
  task: >-
    Pagination and infinite-scroll crawl path
  whatToDo: >-
    Give listing pages stable distinct URLs and sequential anchor links beneath load-more/infinite-scroll interfaces. Links and item discovery must work for intended crawlers without clicking controls or scrolling. Prefer server-delivered links for reliability; test any rendered-link approach. Give distinct paginated content its own canonical URL.
  doneWhen: >-
    Page 2+ and important items are discoverable through crawlable links with valid hrefs. URLs load directly and use intentional canonicals, not blanket page-1 canonicals or fragment-only page numbers. Nonexistent pages and repeated parameters pass the negative tests in 1.12/1.4.
  owners: ["developer"]
  ownerSource: >-
    Developer
  tools: >-
    curl; crawler
  cadence:
    triggers: ["on-feature-ship"]
    source: >-
      When listing templates ship
  notes: >-
    Purpose: indexing/discovery. C02/C06. Source: Pagination. Server rendering is a reliability choice; discoverability and correct output for the intended crawler are the acceptance requirement. Source IDs: SRC044.
  automation: automated
  remediationClass: structural
  detectors: ["pagination-crawl-path"]
  sources:
    - id: "SRC044"
      topic: "Pagination"
      url: "https://developers.google.com/search/docs/specialty/ecommerce/pagination-and-incremental-page-loading"
      usedFor: >-
        1.13: unique page URLs, crawlable sequential links and separate canonicals; no click/scroll dependency.
      verified: "2026-09-08"
- id: "1.14"
  phase: 1
  phaseLabel: "1 — Day 1 architecture"
  priority: P0
  profile: core
  launchGate: true
  applicability:
    universal: false
    any: ["multilingual"]
    source: >-
      Multilingual / multi-country
  task: >-
    International technical implementation
  whatToDo: >-
    Implement stable locale URLs with localized visible content and accurate HTML lang, including language changes where required by the accessibility target. Use supported hreflang codes and fully qualified URLs with self/return references for intended equivalents. Align canonicals with 0.7, including reviewed same-language regional consolidation. Use x-default only for the chosen unmatched-language fallback; keep switching user controlled.
  doneWhen: >-
    Distinct translations remain accessible and indexable; any regional duplicate consolidation matches the approved plan. Hreflang, canonicals, language declarations and switching are consistent. No forced routing hides variants, no alternate points to an unavailable or unrelated page, and the chosen fallback behaves as intended.
  owners: ["localization", "developer", "seo"]
  ownerSource: >-
    Developer + SEO + localization
  tools: >-
    Crawler; hreflang validator; Sources sheet
  cadence:
    triggers: ["on-feature-ship"]
    source: >-
      When locale templates are built
  notes: >-
    Purpose: indexing/discovery; legal/accessibility. C07. Google determines page language from visible content; accurate lang supports assistive technology. Hreflang does not replace translation or justify cross-language canonical collapse. Sources: International sites; Localized versions / hreflang; Declaring language in HTML. Source IDs: SRC012; SRC013; SRC057.
  automation: automated
  remediationClass: config
  detectors: ["hreflang-implementation", "locale-canonical", "lang-attribute"]
  sources:
    - id: "SRC012"
      topic: "International sites"
      url: "https://developers.google.com/search/docs/specialty/international/managing-multi-regional-sites"
      usedFor: >-
        0.7, 1.14, 4.9: stable locale URLs, visible language, user choice and documented same-language regional canonical consolidation.
      verified: "2026-09-09"
    - id: "SRC013"
      topic: "Localized versions / hreflang"
      url: "https://developers.google.com/search/docs/specialty/international/localized-versions"
      usedFor: >-
        0.7, 1.14, 4.9: supported codes, fully qualified equivalent URLs, self/return references and intentional x-default fallback.
      verified: "2026-09-09"
    - id: "SRC057"
      topic: "Declaring language in HTML"
      url: "https://www.w3.org/International/questions/qa-html-language-declarations"
      usedFor: >-
        1.14: accurate document language and language changes support processing and assistive technology; separate from Google's visible-language detection.
      verified: "2026-09-09"
