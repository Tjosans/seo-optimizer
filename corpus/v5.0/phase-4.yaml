    source: >-
      Immediately before launch
  notes: >-
    Purpose: security/governance. F03/F04. First launch uses the approved recoverable state or holding mode, not a nonexistent previous release. Reuse this exercise from 4.8. Preserve alert/log readiness without prescribing a universal log-retention period. Sources: Contingency planning and recovery testing; Monitoring distributed systems; Secure logging guidance. Source IDs: SRC051; SRC052; SRC063.
