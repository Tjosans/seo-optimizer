- id: "2.1"
  phase: 2
  phaseLabel: "2 — Pre-launch config"
  priority: P0
  profile: core
  launchGate: true
  applicability:
    universal: true
    any: []
    source: >-
      All sites
  task: >-
    Sitemaps, robots.txt and index-bloat control
  whatToDo: >-
    Generate sitemaps containing canonical, indexable, 200-only absolute URLs. Use lastmod only for meaningful content changes. Reference sitemaps in robots.txt; keep controls versioned. Keep noindex URLs crawlable until the directive is processed, and control low-value search, filter and tag URLs through the indexability matrix. Exclude internal-search URLs from sitemaps; use noindex for legitimate result-state pages and a real 404 for nonexistent or error-like patterns.
  doneWhen: >-
    robots.txt and sitemaps are valid and fetchable; sitemap URLs agree with canonicals and directives; no launch URL is accidentally blocked; low-value and empty internal-search patterns have explicit crawl, status, canonical, noindex and sitemap rules with no contradictory signals.
  owners: ["developer"]
  ownerSource: >-
    Developer
  tools: >-
    Sitemap validator; Search Console
  cadence:
    triggers: ["on-change"]
    source: >-
      Launch + after content changes
  notes: >-
    v4: clarifies that robots.txt is not a deindexing or canonicalization mechanism.
  automation: automated
  remediationClass: config
  detectors: ["sitemap-validity", "robots-txt", "index-bloat", "sitemap-canonical-agreement"]
  sources: []
