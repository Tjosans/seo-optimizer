- id: "2.1"
  phase: 2
  phaseLabel: "2 — Pre-launch config"
  priority: P0
  profile: core
  launchGate: true
  applicability:
    universal: true
    any: []
    source: >-
      All sites
  task: >-
    Sitemaps, robots.txt and index-bloat control
  whatToDo: >-
    Record the sitemap decision in the URL/indexability plan: sitemaps are useful discovery aids, especially for new or complex sites, but are not a universal indexing prerequisite. If used, validate UTF-8, escaping, absolute URLs and meaningful lastmod; split beyond 50,000 URLs or 50 MB uncompressed per sitemap. Ordinary sitemaps list intended canonical, indexable 200 URLs; document migration exceptions separately. Whether sitemaps are used or omitted, verify crawlable internal discovery against the inventory and test robots.txt GET, host/protocol/port and agent scope, UTF-8, 500 KiB parsing boundary, caching and error responses.
  doneWhen: >-
    The approved use/omission decision and internal-discovery checks are evidenced. Any implemented sitemap files and referenced URLs pass encoding, limit, status, directive and canonical checks. No priority route/resource is accidentally blocked. Excluded search/filter/tag/file patterns have consistent rules. robots.txt behavior, including intentional absence and cache/error cases, is recorded; reliance on noindex is crawl-readable and private access uses authorization.
  owners: ["developer"]
  ownerSource: >-
    Developer
  tools: >-
    Sitemap validator; Search Console
  cadence:
    triggers: ["on-change"]
    source: >-
      Launch + after content changes
  notes: >-
    Purpose: indexing/discovery. D02/C05. Sources: Sitemap construction; robots.txt interpretation; Site moves. Missing robots.txt is an explicit policy decision, not automatic deindexing. Defaults reflect ordinary launch sitemaps, not temporary migration diagnostics. E02: retain the access/indexability gate; an approved sitemap omission is allowed. Source: Sitemap use decision. Source IDs: SRC045; SRC046; SRC096.
  automation: automated
  remediationClass: config
  detectors: ["sitemap-validity", "robots-txt", "index-bloat", "sitemap-canonical-agreement"]
  sources:
    - id: "SRC045"
      topic: "Sitemap construction"
      url: "https://developers.google.com/search/docs/crawling-indexing/sitemaps/build-sitemap"
      usedFor: >-
        2.1: UTF-8, escaping, absolute URLs, 50,000 URL/50 MB uncompressed limits and meaningful lastmod.
      verified: "2026-09-08"
    - id: "SRC046"
      topic: "robots.txt interpretation"
      url: "https://developers.google.com/crawling/docs/robots-txt/robots-txt-spec"
      usedFor: >-
        2.1, 5.5: GET scope, groups, 500 KiB, cache/error behavior. Most 4xx except 429 mean no restrictions; failures may retain cached rules.
      verified: "2026-09-08"
    - id: "SRC096"
      topic: "Sitemap use decision"
      url: "https://developers.google.com/search/docs/crawling-indexing/sitemaps/overview"
      usedFor: >-
        2.1 / 5.4: sitemaps aid discovery and often help new/complex sites; an appropriate approved omission does not itself prevent indexing.
      verified: "2026-09-10"
- id: "2.2"
  phase: 2
  phaseLabel: "2 — Pre-launch config"
  priority: P0
  profile: core
  launchGate: true
  applicability:
    universal: false
    any: ["images", "media", "image-search"]
    source: >-
      Sites with on-page images or image-based controls
  task: >-
    Image alternatives and decorative-image handling
  whatToDo: >-
    Give meaningful images accurate alternative text based on their purpose; give decorative images empty alt. Avoid keyword stuffing and do not duplicate adjacent captions unnecessarily.
  doneWhen: >-
    Priority content images communicate the same purpose without sight; decorative assets are silent to assistive technology.
  owners: ["developer", "content"]
  ownerSource: >-
    Content + developer
  tools: >-
    Screaming Frog; WCAG check
  cadence:
    triggers: ["every-publish"]
    source: >-
      Every content release
  notes: >-
    Purpose: legal/accessibility. v4: separates accessibility-critical alt handling from low-impact filenames. E02: resolve the actual image inventory, including functional and decorative images. An image-free site can use an approved exclusion; shipped image barriers still require correction. Source: Image text alternatives. Source IDs: SRC098.
  automation: automated
  remediationClass: content
  detectors: ["image-alt-quality"]
  sources:
    - id: "SRC098"
      topic: "Image text alternatives"
      url: "https://www.w3.org/WAI/tutorials/images/"
      usedFor: >-
        2.2: actual informative, functional and decorative image inventory determines applicable text-alternative checks.
      verified: "2026-09-10"
- id: "2.3"
  phase: 2
  phaseLabel: "2 — Pre-launch config"
  priority: P2
  profile: extended
  launchGate: false
  applicability:
    universal: false
    any: ["image-search"]
    source: >-
      Sites where image search, Discover or image-rich search appearance matters
  task: >-
    Image discoverability and search-preview optimization
  whatToDo: >-
    Keep important images discoverable at stable URLs, with useful surrounding text and filenames where practical. Use an image sitemap when it improves discovery. For selected Discover pages, provide relevant high-quality imagery. Google's recommendations are at least 1,200 px wide, more than 300,000 total pixels and a useful 16:9 presentation. Preserve the subject when cropping; select representative og:image or supported schema imagery and permit large previews where rights/policy allow.
  doneWhen: >-
    Important images are crawlable and discoverable. Selected pages have a representative image and intentional preview controls. Record decisions against the Discover image recommendations; do not treat them as universal indexability requirements or require special Discover markup. Check rendered crops and avoid generic logos or text-heavy thumbnails where inappropriate.
  owners: ["developer", "content"]
  ownerSource: >-
    Content + developer
  tools: >-
    CMS/media pipeline; image sitemap; page metadata; robots meta
  cadence:
    triggers: []
    source: >-
      When publishing priority media
  notes: >-
    Purpose: search-feature eligibility; optional enhancement. H06. Optional media enhancement. Discover eligibility is assessed separately in 2.16; image quality does not guarantee selection. Source: Discover. Source IDs: SRC025.
  automation: assisted
  remediationClass: content
  detectors: ["image-discoverability"]
  sources:
    - id: "SRC025"
      topic: "Discover"
      url: "https://developers.google.com/search/docs/appearance/google-discover"
      usedFor: >-
        2.3,2.16: indexed/policy eligibility beyond publishers, no special markup, recommended image dimensions/crops/large previews and no appearance guarantee.
      verified: "2026-09-09"
- id: "2.4"
  phase: 2
  phaseLabel: "2 — Pre-launch config"
  priority: P1
  profile: core
  launchGate: false
  applicability:
    universal: true
    any: []
    source: >-
      All sites
  task: >-
    Search Console ownership and configuration
  whatToDo: >-
    Verify the appropriate production property using a durable supported method independent of optional analytics. Prefer a Domain property when DNS control is available; use a correctly scoped URL-prefix property where needed. Record an accountable verified owner, secured recovery and appropriate backup access where feasible. Keep valid verification tokens in place, avoid overwriting other owners' tokens and grant monitoring staff the permissions they need. Document the intended sitemap URL.
  doneWhen: >-
    The property covers the intended production URLs and an accountable verified owner can access it. Monitoring permissions and recovery are documented, with backup access where feasible; two owners are not compulsory and shared credentials are not a substitute. Verification remains valid independently of optional tags. Pending setup stays recorded as pending, with an owner and next action; it is not a ranking or website-launch prerequisite.
  owners: ["business", "seo"]
  ownerSource: >-
    SEO + business owner
  tools: >-
    Search Console; supported ownership method; access/recovery record
  cadence:
    triggers: ["before-launch"]
    interval: quarterly
    source: >-
      Before launch; review access quarterly
  notes: >-
    Purpose: measurement. C14. Recommended monitoring setup, P1/nongating. Domain and URL-prefix properties have different scope and verification options. The live technical requirements in 5.4 remain gates; account setup or report availability is not an indexing guarantee. Sources: Search Console property types; Verify site ownership. Source IDs: SRC087; SRC088.
  automation: assisted
  remediationClass: config
  detectors: ["gsc-property-ownership"]
  sources:
    - id: "SRC087"
      topic: "Search Console property types"
      url: "https://support.google.com/webmasters/answer/34592?hl=en"
      usedFor: >-
        2.4/5.4: Domain versus URL-prefix scope/verification and monitoring access; adding a property is not a website Search or ranking prerequisite.
      verified: "2026-09-09"
    - id: "SRC088"
      topic: "Verify site ownership"
      url: "https://support.google.com/webmasters/answer/9008080?hl=en"
      usedFor: >-
        2.4: durable supported verification, retaining tokens, accountable verified ownership and recovery; multiple owners/methods possible without an arbitrary two-owner requirement.
      verified: "2026-09-09"
- id: "2.5"
  phase: 2
  phaseLabel: "2 — Pre-launch config"
  priority: P0
  profile: core
  launchGate: true
  applicability:
    universal: false
    any: ["analytics"]
    source: >-
      Sites using analytics or conversion measurement
  task: >-
    Analytics and conversion implementation
  whatToDo: >-
    Implement only the approved 0.4 instrumentation. Configure ownership, timezone, retention, test/internal traffic and applicable values, currency, cross-domain/referral handling. Choose one route/pageview emission method and prevent duplicate triggers. Use safe unique transaction IDs where relevant; remove prohibited payload fields before transmission. If GA4/Search Console linking is selected, match page scope and web stream, permissions and reporting ownership.
  doneWhen: >-
    Collection, suppression, values and attribution match the approved state matrix. Expected events are neither missing nor duplicated; relevant transactions reconcile with test records. SPA routes carry current page/referrer data, required cross-domain identifiers survive redirects, and prohibited data is absent from inspected payloads. The optional GA4/Search Console link is correctly scoped if chosen; its absence does not fail this gate.
  owners: ["analytics", "developer", "business"]
  ownerSource: >-
    Developer + analytics + business
  tools: >-
    Chosen analytics debugger; browser network tools; tag debugger; Search Console Associations
  cadence:
    triggers: ["before-launch", "on-change"]
    source: >-
      Before launch and after tracking changes
  notes: >-
    Purpose: measurement; legal/accessibility. C12/D06. Check live payloads and recipient diagnostics, not only tag configuration. GA4 purchase deduplication needs a nonempty unique transaction_id without customer-identifying data; do not reuse IDs across orders/users or assume all event types are deduplicated. Sources: GA4 SPA measurement; GA4 transaction IDs; GA4 cross-domain measurement; Analytics PII prevention; Search Console and GA4 linking. Source IDs: SRC065; SRC066; SRC067; SRC068; SRC069.
  automation: assisted
  remediationClass: config
  detectors: ["analytics-implementation"]
  sources:
    - id: "SRC065"
      topic: "Analytics PII prevention"
      url: "https://support.google.com/analytics/answer/6366371"
      usedFor: >-
        2.5, 4.7, 5.6: remove prohibited identifiers from URLs, titles and collected fields; redaction settings are not complete payload verification.
      verified: "2026-09-09"
    - id: "SRC066"
      topic: "GA4 SPA measurement"
      url: "https://developers.google.com/analytics/devguides/collection/ga4/single-page-applications"
      usedFor: >-
        2.5, 4.7: deliberate virtual-pageview emission, avoid double tracking, inspect current page_location/page_referrer and navigation behavior.
      verified: "2026-09-09"
    - id: "SRC067"
      topic: "GA4 transaction IDs"
      url: "https://support.google.com/analytics/answer/12313109"
      usedFor: >-
        2.5, 4.7, 5.6: web purchase deduplication needs unique nonempty transaction IDs without customer-identifying data; avoid reused IDs and generic deduplication claims.
      verified: "2026-09-09"
    - id: "SRC068"
      topic: "Search Console and GA4 linking"
      url: "https://support.google.com/analytics/answer/10737381"
      usedFor: >-
        0.4, 2.5: optional integration of matching page scope, web stream and properties; verify permissions and reporting limits if selected.
      verified: "2026-09-09"
    - id: "SRC069"
      topic: "GA4 cross-domain measurement"
      url: "https://support.google.com/analytics/answer/10071811?hl=en"
      usedFor: >-
        2.5, 4.7: selected cross-domain journeys use consistent configuration; verify destination functionality and preserved linker parameters through redirects.
      verified: "2026-09-09"
- id: "2.6"
  phase: 2
  phaseLabel: "2 — Pre-launch config"
  priority: P0
  profile: core
  launchGate: true
  applicability:
    universal: false
    any: ["consent"]
    source: >-
      Sites where consent is required and/or Google tags use Consent Mode
  task: >-
    Consent platform and Google Consent Mode configuration
  whatToDo: >-
    Implement the qualified 0.9 privacy decision for the actual regions, vendors and data. Where Google Consent Mode is selected, record Basic/Advanced mode and affected consent types, including ad_user_data/ad_personalization where applicable. Set approved defaults before configuration/events; update choices before navigation and persist/restore them as designed. Test first visit, accept, reject, partial consent, withdrawal and return visits at network/storage level.
  doneWhen: >-
    Tag loading, transmission and storage match the approved policy in every required state, including delayed banner/tag loading. Basic blocks Google data until consent; Advanced denied states may send documented cookieless measurements only where approved. Choice changes and withdrawal affect subsequent behavior correctly, denied paths remain usable, and unapproved disclosure or unresolved scope fails.
  owners: ["analytics", "developer", "privacy", "legal"]
  ownerSource: >-
    Privacy/legal + developer + analytics
  tools: >-
    CMP; Tag Assistant; browser storage/network tools; Sources sheet
  cadence:
    triggers: ["before-launch", "on-change"]
    source: >-
      Before launch and after CMP/tag changes
  notes: >-
    Purpose: legal/accessibility; security/governance. C13. The chosen mode must fit the qualified policy; Consent Mode is a signal mechanism, not legal certification. No cookies does not mean no transmission. Existing stored data and any deletion obligations need their own approved handling. Sources: Google Consent Mode; Consent Mode implementation timing. Source IDs: SRC004; SRC064.
  automation: assisted
  remediationClass: config
  detectors: ["consent-mode-config"]
  sources:
    - id: "SRC004"
      topic: "Google Consent Mode"
      url: "https://developers.google.com/tag-platform/security/concepts/consent-mode"
      usedFor: >-
        0.4, 2.6, 5.6: Basic/Advanced behavior, consent types and limitations. Denied storage can still involve transmission in Advanced mode; mode selection follows qualified scope.
      verified: "2026-09-09"
    - id: "SRC064"
      topic: "Consent Mode implementation timing"
      url: "https://developers.google.com/tag-platform/security/guides/consent"
      usedFor: >-
        2.6, 4.7: defaults before config/events, updates before page transitions, choice persistence and withdrawal; validate the actual implementation.
      verified: "2026-09-09"
- id: "2.7"
  phase: 2
  phaseLabel: "2 — Pre-launch config"
  priority: P1
  profile: extended
  launchGate: false
  applicability:
    universal: false
    any: ["structured-data"]
    source: >-
      Templates eligible for useful structured data
  task: >-
    Structured-data eligibility matrix and implementation
  whatToDo: >-
    For each marked template record vocabulary, supported format, intended consumer/feature, required and recommended properties, content source and maintenance owner. Prefer JSON-LD; accept supported Microdata/RDFa. Decide relevant Organization, LocalBusiness, Article, Product/ProductGroup, VideoObject, paywall, BreadcrumbList and other types using current feature guidance. Describe actual page/entity content; do not generate empty boilerplate entities or infer Google support from Schema.org validity.
  doneWhen: >-
    The matrix distinguishes valid vocabulary from each selected feature's eligibility and records required-property results and recommended-property decisions. Shipped markup is accurate and passes 4.6; misleading/invalid output is corrected or removed. Valid markup without a Google feature may remain for a documented consumer/purpose. Feature adoption is optional and validation never guarantees display.
  owners: ["developer", "seo"]
  ownerSource: >-
    Developer + SEO
  tools: >-
    Schema.org validator; Rich Results Test; Search Console; Sources sheet
  cadence:
    triggers: ["every-template"]
    source: >-
      Every new template
  notes: >-
    Purpose: search-feature eligibility; optional enhancement. C09/H05. Google FAQ rich results are no longer available, verified 2026-09-09. FAQPage remains Schema.org vocabulary; keep it only for a documented purpose rather than a Google FAQ feature/report promise. Sources: Structured-data guidelines; Google structured data features; Schema.org FAQPage; Google Search documentation updates. Source IDs: SRC007; SRC008; SRC035; SRC071.
  automation: assisted
  remediationClass: code
  detectors: ["schema-eligibility-matrix"]
  sources:
    - id: "SRC007"
      topic: "Google Search documentation updates"
      url: "https://developers.google.com/search/updates"
      usedFor: >-
        2.7, 7.9: current feature changes, including Google FAQ rich-result withdrawal. Also tracks AI, migration and review-policy changes; verify each specific claim before use.
      verified: "2026-09-09"
    - id: "SRC008"
      topic: "Structured-data guidelines"
      url: "https://developers.google.com/search/docs/appearance/structured-data/sd-policies"
      usedFor: >-
        2.7/4.6/7.9 and E02: validate the selected feature, content accuracy and visibility; feature eligibility is distinct from general web ranking and does not guarantee display.
      verified: "2026-09-10"
    - id: "SRC035"
      topic: "Schema.org FAQPage"
      url: "https://schema.org/FAQPage"
      usedFor: >-
        2.7, 7.9: FAQPage remains vocabulary for FAQ content. This replaces an obsolete FAQ API-history proof link; Google feature availability is checked in the separate updates source.
      verified: "2026-09-09"
    - id: "SRC071"
      topic: "Google structured data features"
      url: "https://developers.google.com/search/docs/appearance/structured-data/search-gallery"
      usedFor: >-
        2.7, 4.6, 7.9: select currently supported features and follow the relevant individual guidance; vocabulary validity alone is not feature support.
      verified: "2026-09-09"
