services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: seo
      POSTGRES_PASSWORD: seo
      POSTGRES_DB: seo_optimizer
    # Host ports are overridable: 5432/6379 are commonly already taken by
    # another local stack, so this project defaults one port up.
    ports: ["${POSTGRES_PORT:-5433}:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U seo -d seo_optimizer"]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    ports: ["${REDIS_PORT:-6380}:6379"]
    command: ["redis-server", "--appendonly", "yes"]
    volumes: ["redisdata:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
  minio:
    image: quay.io/minio/minio:latest
    environment:
      MINIO_ROOT_USER: seo-storage
      MINIO_ROOT_PASSWORD: seo-storage-secret
    # S3 API on the first port, web console on the second. Both default one up
    # from MinIO's own defaults for the same reason Postgres and Redis do.
    ports: ["${MINIO_PORT:-9002}:9000", "${MINIO_CONSOLE_PORT:-9003}:9001"]
    command: ["server", "/data", "--console-address", ":9001"]
    volumes: ["miniodata:/data"]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  pgdata:
  redisdata:
  miniodata:
