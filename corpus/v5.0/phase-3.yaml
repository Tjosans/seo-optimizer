- id: "3.9"
  phase: 3
  phaseLabel: "3 — Content & trust"
  priority: P0
  profile: core
  launchGate: true
  applicability:
    universal: false
    any: ["bulk-publishing"]
    source: >-
      Bulk/programmatic publishing or materially AI-generated batches
  task: >-
    Batch publishing inventory, quality checks and release safeguard
  whatToDo: >-
    Before a batch becomes indexable, record its URL inventory, legitimate user need, sources and distinct value. Define automated checks over the full batch and human review by risk, including consequential claims under 3.6. Test duplicate/template-only output, wrong entities/locations, unsupported promises, doorway patterns and factual errors. Include high-risk and edge cases in the sample. Assign a release owner, acceptance criteria and a correction/removal route; quarantine failing pages.
  doneWhen: >-
    The inventory and review scope are complete, required checks pass and sampled defects are investigated across affected pages. Only approved passing pages enter the indexable release; failing pages remain excluded or unpublished and are retested after correction. Sources, decisions and owner are recorded. Explain creation methods where users reasonably need that context. Sampling is not a guarantee that every claim is correct.
  owners: ["developer", "content", "seo"]
  ownerSource: >-
    Content owner + qualified reviewer + developer + SEO
  tools: >-
    Batch inventory; automated content checks; risk-based editorial sample; publishing controls
  cadence:
    triggers: ["on-change"]
    source: >-
      Before first batch and each material batch release; after generator/data-source changes
  notes: >-
    Purpose: security/governance. D03/E01. Conditional publishing risk gate. Old 3.9 formatting now lives in 3.5; this ID has a new criterion and purpose. Ordinary drafting uses 3.5/3.6 unless batch scope applies. Sources: Generative AI content guidance; Spam policies. Source IDs: SRC029; SRC079.
  automation: assisted
  remediationClass: content
  detectors: ["batch-page-quality"]
  sources:
    - id: "SRC029"
      topic: "Spam policies"
      url: "https://developers.google.com/search/docs/essentials/spam-policies"
      usedFor: >-
        3.9,3.13: scaled-content, doorway, link-spam and current site-reputation policy; actual third-party arrangements and integration factors, not a blanket ban on contributors.
      verified: "2026-09-09"
    - id: "SRC079"
      topic: "Generative AI content guidance"
      url: "https://developers.google.com/search/docs/fundamentals/using-gen-ai-content"
      usedFor: >-
        3.9: AI can support useful work; bulk generation without added user value risks scaled-content abuse. The batch-testing workflow is this checklist's operational safeguard.
      verified: "2026-09-09"
