- id: "1.1"
  phase: 1
  phaseLabel: "1 — Day 1 architecture"
  priority: P0
  profile: core
  launchGate: true
  applicability:
    universal: true
    any: []
    source: >-
      All sites
  task: >-
    Rendering strategy and raw/rendered parity
  whatToDo: >-
    Choose rendering for the intended crawlers. Prefer server-delivered critical content as a reliability policy; SSR/SSG is not a universal Google requirement. Test initial and rendered metadata, content and links, resource/API access, hydration, deep links and missing-page behavior without user interaction. Record and justify meaningful differences against the URL matrix.
  doneWhen: >-
    Every indexable template exposes required content and crawlable links to intended crawlers. Raw/rendered directives and canonicals do not conflict; initial noindex is absent on approved indexable pages. Resource failures and missing routes are tested. Required output stays inside the verified fetch envelope in 1.5.
  owners: ["developer"]
  ownerSource: >-
    Developer
  tools: >-
    curl; View Source; URL Inspection
  cadence:
    triggers: ["every-template"]
    source: >-
      Every new template
  notes: >-
    Purpose: indexing/discovery. C02/D01. Successful browser rendering alone does not prove every crawler can render. Sources: JavaScript SEO basics; JavaScript troubleshooting; Googlebot fetch limits. Source IDs: SRC038; SRC039; SRC040.
  automation: automated
  remediationClass: structural
  detectors: ["raw-rendered-parity", "rendering-strategy-classifier"]
  sources:
    - id: "SRC038"
      topic: "JavaScript SEO basics"
      url: "https://developers.google.com/search/docs/crawling-indexing/javascript/javascript-seo-basics"
      usedFor: >-
        1.1, 1.10: rendering, raw noindex, canonical consistency and crawlable output; SSR is a reliability policy.
      verified: "2026-09-08"
    - id: "SRC039"
      topic: "JavaScript troubleshooting"
      url: "https://developers.google.com/search/docs/crawling-indexing/javascript/fix-search-javascript"
      usedFor: >-
        1.1: renderer limitations, resource/API access and reproducible raw/rendered diagnostics.
      verified: "2026-09-08"
    - id: "SRC040"
      topic: "Googlebot fetch limits"
      url: "https://developers.google.com/search/docs/crawling-indexing/googlebot"
      usedFor: >-
        1.1, 1.5, 0.3: uncompressed per-file fetch caps; Search: 2 MB non-PDF, 64 MB PDF; separate resources. Reverify with crawler/payload changes.
      verified: "2026-09-08"
- id: "1.2"
  phase: 1
  phaseLabel: "1 — Day 1 architecture"
  priority: P0
  profile: core
  launchGate: true
  applicability:
    universal: true
    any: []
    source: >-
      All sites
  task: >-
    Semantic HTML and crawlable links
  whatToDo: >-
    Use real a href links, semantic landmarks, one clear primary page heading and a logical heading hierarchy. Do not treat a strict single-H1 rule as a ranking requirement.
  doneWhen: >-
    Priority URLs are reachable through normal links; landmarks, link purpose and heading hierarchy are usable by crawlers and assistive technology.
  owners: ["developer", "designer"]
  ownerSource: >-
    Developer + designer
  tools: >-
    HTML validator; Screaming Frog
  cadence:
    triggers: ["every-template"]
    source: >-
      Every template
  notes: >-
    Purpose: indexing/discovery; legal/accessibility. Source IDs: SRC014; SRC103.
  automation: automated
  remediationClass: structural
  detectors: ["semantic-html", "crawlable-links", "heading-outline"]
  sources:
    - id: "SRC014"
      topic: "WCAG 2.2"
      url: "https://www.w3.org/TR/WCAG22/"
      usedFor: >-
        0.9, 4.4: declared target and conformance requirements, including full pages/processes, supported use and non-interference; qualified scope determines obligations.
      verified: "2026-09-09"
    - id: "SRC103"
      topic: "Crawlable links and anchor text"
      url: "https://developers.google.com/search/docs/crawling-indexing/links-crawlable"
      usedFor: >-
        1.2 / 3.3: crawlable anchors and href attributes, descriptive contextual links and links to important pages. Few clicks is a project usability target, not a numeric Google rule.
      verified: "2026-09-10"
- id: "1.3"
  phase: 1
  phaseLabel: "1 — Day 1 architecture"
  priority: P0
  profile: core
  launchGate: true
  applicability:
    universal: true
    any: []
    source: >-
      All sites
  task: >-
    Routing and canonicalization
  whatToDo: >-
    Document descriptive, stable URL paths and host/slash/parameter conventions. Preserve meaningful case-sensitive paths. For equivalent duplicates choose a permanent 301/308 redirect, or document an intentional 200 duplicate with consistent canonical signals. Align internal links and sitemaps with the preferred accessible, indexable URL; use self-canonicals where appropriate.
  doneWhen: >-
    Sampled variants follow the approved mapping. Retained 200 duplicates have a justified canonical policy; targets work and are indexable. No conflicting signals, loops or accidental duplicates exist on priority patterns. Controlled redirects use one hop where feasible; external chains are assessed by impact.
  owners: ["developer"]
  ownerSource: >-
    Developer
  tools: >-
    curl -I; Screaming Frog; Search Console
  cadence:
    triggers: ["on-change"]
    source: >-
      Launch + after URL changes
  notes: >-
    Purpose: indexing/discovery. C03. Canonical declarations express a preference, not guaranteed selection. Sources: Canonicalization; Redirects and Google Search; URL structure. Source IDs: SRC010; SRC024; SRC041.
  automation: assisted
  remediationClass: config
  detectors: ["canonicalization", "url-convention", "host-slash-policy"]
  sources:
    - id: "SRC010"
      topic: "Canonicalization"
      url: "https://developers.google.com/search/docs/crawling-indexing/consolidate-duplicate-urls"
      usedFor: >-
        1.3, 1.6, 1.16: retained duplicates, preferred-URL signals, supported non-HTML Link canonical; selection is not guaranteed.
      verified: "2026-09-08"
    - id: "SRC024"
      topic: "URL structure"
      url: "https://developers.google.com/search/docs/crawling-indexing/url-structure"
      usedFor: >-
        Descriptive URL paths, characters and parameter best practices
      verified: "2026-08-26"
    - id: "SRC041"
      topic: "Redirects and Google Search"
      url: "https://developers.google.com/search/docs/crawling-indexing/301-redirects"
      usedFor: >-
        1.3, 1.6: permanent/temporary redirect choices, 301/308 and usable destination mappings.
      verified: "2026-09-08"
- id: "1.4"
  phase: 1
  phaseLabel: "1 — Day 1 architecture"
  priority: P0
  profile: core
  launchGate: true
  applicability:
    universal: true
    any: []
    source: >-
      All sites
  task: >-
    HTTP status handling
  whatToDo: >-
    Test successful responses, permanent/temporary redirects, missing/removed URLs, internal search, invalid facets/pagination and application failures. Use 404/410 for genuinely absent resources, 503 for temporary service unavailability and 429 for deliberate throttling. Follow the indexability matrix for valid search-result states, normally 200 with noindex. Never mask application failures as indexable 200 pages.
  doneWhen: >-
    Representative responses match the matrix. Valid empty search states are distinguished from nonexistent/error-like URLs and invalid facets. Missing resources return genuine errors with useful UX; no unintended soft 404, redirect loop or indexable error response remains. Excluded search states stay out of ordinary sitemaps.
  owners: ["developer"]
  ownerSource: >-
    Developer
  tools: >-
    curl -I; Screaming Frog; server logs
  cadence:
    triggers: []
    interval: weekly
    windowDays: 30
    source: >-
      Launch + weekly for 30 days
  notes: >-
    Purpose: indexing/discovery. C04. A temporary outage is not a permanent removal. Correct status handling does not make an active production outage acceptable. Sources: HTTP status codes; Faceted navigation. Source IDs: SRC042; SRC043.
  automation: assisted
  remediationClass: code
  detectors: ["http-status", "soft-404", "redirect-chain", "internal-search-indexability"]
  sources:
    - id: "SRC042"
      topic: "HTTP status codes"
      url: "https://developers.google.com/crawling/docs/troubleshooting/http-status-codes"
      usedFor: >-
        1.4: 4xx, 429 and 5xx behavior; distinguish genuine absence, temporary failure and success.
      verified: "2026-09-08"
    - id: "SRC043"
      topic: "Faceted navigation"
      url: "https://developers.google.com/crawling/docs/faceted-navigation"
      usedFor: >-
        1.12, 1.4: bounded crawl spaces, stable filters and 404 for no-result/nonsensical filters and nonexistent pages.
      verified: "2026-09-08"
- id: "1.5"
  phase: 1
  phaseLabel: "1 — Day 1 architecture"
  priority: P0
  profile: core
  launchGate: true
  applicability:
    universal: true
    any: []
    source: >-
      All sites
  task: >-
    Performance acceptance criteria, diagnostics and fetch budgets
  whatToDo: >-
    Before testing, classify per-template LCP, CLS, TBT, asset/request and TTFB budgets as launch thresholds or diagnostics. Freeze devices, network, cache state, journeys and repeat/summary method. Expose the LCP resource promptly without lazy-loading it. Separately measure each uncompressed document/resource against current crawler limits and a margin. Test fonts, fallback metrics, required glyphs, layout shifts and delivery of changed cached assets.
  doneWhen: >-
    The versioned policy identifies each launch threshold, diagnostic target, test profile and owner. Templates meet current acceptance criteria and per-file fetch limits. Required text/glyphs remain usable during font delay/failure; changed cached assets reach returning users. Diagnostic overruns have impact, owner and due date. A failed criterion remains failed until corrected or formally revised and retested; an exception alone cannot pass the gate.
  owners: ["developer"]
  ownerSource: >-
    Developer
  tools: >-
    Lighthouse CI; WebPageTest; PageSpeed Insights; bundle analyzer
  cadence:
    triggers: []
    interval: monthly
    windowDays: 30
    source: >-
      Launch; weekly 30 days; monthly
  notes: >-
    Purpose: measurement; security/governance. C08/D01/D05. TBT is a lab diagnostic, not field INP. Keep crawler byte limits separate from total page weight and project budgets: Googlebot Search verified 2026-09-08 at 2 MB per non-PDF and 64 MB per PDF, uncompressed, with separate CSS/JS fetches. Font subsets need permission and required glyphs; system fonts are valid. Sources: Web Vitals metrics; Googlebot fetch limits; Font performance; HTTP cache and versioned assets. Source IDs: SRC006; SRC040; SRC048; SRC049; SRC053; SRC093.
  automation: assisted
  remediationClass: code
  detectors: ["lab-perf-budget", "lcp-element-strategy", "crawler-fetch-limit"]
  sources:
    - id: "SRC006"
      topic: "Lab versus field data"
      url: "https://web.dev/articles/lab-and-field-data-differences"
      usedFor: >-
        1.5, 4.5, 4.11: controlled lab profiles versus real-user distributions; results and populations are not interchangeable.
      verified: "2026-09-09"
    - id: "SRC040"
      topic: "Googlebot fetch limits"
      url: "https://developers.google.com/search/docs/crawling-indexing/googlebot"
      usedFor: >-
        1.1, 1.5, 0.3: uncompressed per-file fetch caps; Search: 2 MB non-PDF, 64 MB PDF; separate resources. Reverify with crawler/payload changes.
      verified: "2026-09-08"
    - id: "SRC048"
      topic: "HTTP cache and versioned assets"
      url: "https://web.dev/articles/http-cache"
      usedFor: >-
        1.5, 1.7: cache/revalidation choices and changed asset URLs for reliable updates to returning users.
      verified: "2026-09-09"
    - id: "SRC049"
      topic: "Font performance"
      url: "https://web.dev/articles/font-best-practices"
      usedFor: >-
        1.5: delayed/failing fonts, fallback metrics, glyph-preserving licensed subsets and layout shift; system fonts remain valid.
      verified: "2026-09-09"
    - id: "SRC053"
      topic: "Web Vitals metrics"
      url: "https://web.dev/articles/vitals"
      usedFor: >-
        1.5, 4.5, 6.2: LCP/INP/CLS at p75 by device; Good <=2.5 s/200 ms/0.1; TBT lab diagnostics do not replace field INP.
      verified: "2026-09-09"
    - id: "SRC093"
      topic: "Googlebot fetch-limit history"
      url: "https://developers.google.com/search/blog/2026/03/crawler-blog-post"
      usedFor: >-
        H07 source correction for 1.5: 2026-03-31 publication already documents 2 MB per-resource/64MB PDF limits. Use current Googlebot documentation for implementation; screenshot novelty claim is unsupported.
      verified: "2026-09-09"
