- id: "2.13"
  phase: 2
  phaseLabel: "2 — Pre-launch config"
  priority: P2
  profile: core
  launchGate: false
  applicability:
    universal: true
    any: []
    source: >-
      All sites
  task: >-
    Favicon, site name and search identity
  whatToDo: >-
    Reference a stable, brand-representative square favicon from the homepage; the image may be on a CDN. Use a current supported format such as PNG/ICO, at least 8x8px and preferably larger than 48x48px. Allow Googlebot access to the homepage and Googlebot-Image access to the asset. Provide consistent WebSite name/url data on the eligible domain/subdomain homepage; reuse the existing WebSite node and align visible brand signals.
  doneWhen: >-
    The homepage references the intended accessible favicon with a supported format and square dimensions meeting the minimum. Site-name data uses the canonical homepage URL and consistent identity. Check relevant duplicate homepages for consistent data. A separate subdirectory search site name is not promised, and lack of chosen display is not proof of invalid implementation.
  owners: ["developer", "designer", "seo"]
  ownerSource: >-
    Developer + designer + SEO
  tools: >-
    Browser; Rich Results/schema validator; robots test; Search Console
  cadence:
    triggers: ["before-launch", "on-change"]
    source: >-
      Before launch; after brand/domain changes
  notes: >-
    Purpose: search-feature eligibility; optional enhancement. C15. Optional search-identity enhancement, not a launch requirement or ranking promise. One favicon is supported per hostname; site-name scope is domain/subdomain, with www/m generally treated as equivalent. A larger-than 48x48 favicon is a recommendation, not the 8x8 minimum. Sources: Favicon in Search; Site names. Source IDs: SRC022; SRC023.
  automation: automated
  remediationClass: config
  detectors: ["favicon-site-name"]
  sources:
    - id: "SRC022"
      topic: "Favicon in Search"
      url: "https://developers.google.com/search/docs/appearance/favicon-in-search"
      usedFor: >-
        2.13: CDN permitted; supported formats, square 8x8 minimum and recommendation above 48x48; homepage/asset crawler access and hostname scope.
      verified: "2026-09-09"
    - id: "SRC023"
      topic: "Site names"
      url: "https://developers.google.com/search/docs/appearance/site-names"
      usedFor: >-
        2.13: WebSite name/url on eligible domain/subdomain homepage, consistent duplicates and signals, reuse existing node; no separate subdirectory site names.
      verified: "2026-09-09"
- id: "2.14"
  phase: 2
  phaseLabel: "2 — Pre-launch config"
  priority: P1
  profile: extended
  launchGate: false
  applicability:
    universal: false
    any: ["video"]
    source: >-
      Sites where indexable video is a primary content asset
  task: >-
    Video search and watch-page optimization
  whatToDo: >-
    For selected video-search goals, provide a dedicated watch page whose main purpose is one video, with unique title/context and a prominent discoverable playable player. Check intended indexability, stable accessible thumbnails/video resources and accurate eligible VideoObject. Validate third-party embed access where used. Use a video sitemap when useful, with the watch-page URL as loc and correct video/player/thumbnail fields. Assign post-launch indexing/performance review.
  doneWhen: >-
    Selected watch-page templates expose the intended playable main video and required accessible resources without a user action needed for discovery. Chosen markup/feed validates and agrees with the video. A product/article page with supplemental video is not claimed as a dedicated watch page. Record indexed evidence when available after launch; unavailable field data or lack of feature display is not invented as a pass.
  owners: ["developer", "content", "seo"]
  ownerSource: >-
    Content + developer + SEO
  tools: >-
    Rich Results Test; video sitemap; Search Console; crawler
  cadence:
    triggers: ["before-launch"]
    source: >-
      Before launch for video templates; review when publishing video
  notes: >-
    Purpose: search-feature eligibility; optional enhancement. H06. Conditional video-feature enhancement; adoption remains nongating. Ordinary pages with complementary video can still appear as text results. Template implementation and actual video indexing/display are separate. Source: Video SEO. Source IDs: SRC026.
  automation: automated
  remediationClass: code
  detectors: ["video-watch-page", "videoobject-schema", "video-sitemap"]
  sources:
    - id: "SRC026"
      topic: "Video SEO"
      url: "https://developers.google.com/search/docs/appearance/video"
      usedFor: >-
        2.14: dedicated main-video watch page, discoverable player/resources, third-party access, accurate structured data and optional sitemap; supplemental video differs.
      verified: "2026-09-09"
- id: "2.15"
  phase: 2
  phaseLabel: "2 — Pre-launch config"
  priority: P0
  profile: extended
  launchGate: true
  applicability:
    universal: false
    any: ["paywall"]
    source: >-
      Sites with paywalled or registration-gated publishing, whether indexed or deliberately excluded
  task: >-
    Paywall, registration and gated-content indexing
  whatToDo: >-
    Approve the intended indexing, sampling and access model for gated publishing. Test authorized readers, logged-out clients and verified eligible crawlers against that policy, including raw/rendered responses, APIs and shared caches. For indexed paywalled content use accurate isAccessibleForFree=false; apply hasPart/cssSelector for relevant section granularity and record recommended-property decisions. Private account data requires real authorization; a Googlebot-like user agent must never grant private access.
  doneWhen: >-
    Observed reader/crawler access and previews match approved policy. Indexed paywall markup meets required properties and chosen section selectors match actual content. Deliberately excluded publishing follows 1.8; noindex alone does not protect private data. No unauthorized private content is exposed through page, API or cache responses. Resolve and retest blocking defects before this gate passes.
  owners: ["developer", "business", "content", "legal"]
  ownerSource: >-
    Developer + content + legal/business
  tools: >-
    URL Inspection; Rich Results/schema validator; crawler; access-control tests
  cadence:
    triggers: ["before-build", "on-change"]
    source: >-
      Before gated content launches; after access-model changes
  notes: >-
    Purpose: indexing/discovery; security/governance. C17. Conditional gate protecting private data and intended search access. Keep public paid-publishing access distinct from private user accounts. Googlebot identity is verified under 1.7; labels or user-agent probes alone are insufficient. Sources: Paywalled content; Verify Google crawler requests. Source IDs: SRC028; SRC050.
  automation: assisted
  remediationClass: structural
  detectors: ["paywall-access-model"]
  sources:
    - id: "SRC028"
      topic: "Paywalled content"
      url: "https://developers.google.com/search/docs/appearance/structured-data/paywalled-content"
      usedFor: >-
        2.15: intended crawler access to indexed paid content; required isAccessibleForFree and recommended section granularity; access and preview choices.
      verified: "2026-09-09"
    - id: "SRC050"
      topic: "Verify Google crawler requests"
      url: "https://developers.google.com/crawling/docs/crawlers-fetchers/verify-google-requests"
      usedFor: >-
        1.7,2.9,5.5,2.15: genuine crawler identity differs from synthetic user-agent probes; use documented DNS/IP methods before trusting crawler-only access.
      verified: "2026-09-09"
- id: "2.16"
  phase: 2
  phaseLabel: "2 — Pre-launch config"
  priority: P2
  profile: extended
  launchGate: false
  applicability:
    universal: false
    any: ["discover"]
