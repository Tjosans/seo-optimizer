- id: "4.12"
  phase: 4
  phaseLabel: "4 — Pre-launch QA"
  priority: P0
  profile: extended
  launchGate: true
  applicability:
    universal: true
    any: []
    source: >-
      All sites
  task: >-
    Backup, rollback and launch-owner rehearsal
  whatToDo: >-
    Rehearse 1.17 recovery using the required backups, access and launch contacts. Restore the chosen first-launch target or existing release/data state, including the plan for post-cutover writes. Before cutover configure monitor owners, severity, routing and response targets; safely test alert delivery and escalation. Where diagnostics need logs, test approved collection, access restrictions, redaction and retention with representative records.
  doneWhen: >-
    A recorded timed exercise restores the agreed state within recovery-time and data-loss limits; a holding mode meets its approved response/indexing behavior and duration. Contacts are current and a safe alert test reaches the monitored recipient within target. Required diagnostic records are retrievable under the approved controls. Missing or failed readiness remains HOLD; live confirmation follows in 5.5.
  owners: ["operations", "developer", "business"]
  ownerSource: >-
    Operations + developer + business
  tools: >-
    Runbook; hosting platform; monitoring
  cadence:
