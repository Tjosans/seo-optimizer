  whatToDo: >-
    Before cutover, test the full 0.8 URL inventory and redirect configuration in a controlled environment, including relevant query/host variants and assets. Validate every planned status/target automatically; compare content and SEO signals by the approved value/template matrix. Confirm destination readiness, durable GSC ownership and Change of Address eligibility. Reference the timed recovery exercise in 4.12 and recheck inherited-domain findings where applicable.
  doneWhen: >-
    Every inventoried outcome matches the approved map: retained content has a relevant working destination, unchanged URLs remain correct, and deliberate retirements return the intended 404/410. No unintended chain, loop, missing mapping or irrelevant consolidation remains. Required parity and inherited-domain checks pass; recovery evidence meets 4.12. Live redirect activation and eligible Change of Address submission remain 5.2.
  owners: ["operations", "developer", "seo"]
  ownerSource: >-
    SEO + developer + operations
  tools: >-
    Old/new crawl diff; redirect tester; analytics/GSC baseline
  cadence:
    triggers: ["cutover"]
    source: >-
      Immediately before cutover
  notes: >-
    Purpose: indexing/discovery; security/governance. C21/F01. Full-map status/target testing is distinct from risk-based content sampling. Approved intentional changes are recorded before testing; signing off a failed current criterion does not make it Passed. Sources: Google site moves; Change of Address. Source IDs: SRC011; SRC059.
  automation: assisted
  remediationClass: config
  detectors: ["migration-redirect-test", "content-parity-diff"]
  sources:
    - id: "SRC011"
      topic: "Google site moves"
      url: "https://developers.google.com/search/docs/crawling-indexing/site-move-with-url-changes"
