- id: "1.17"
  phase: 1
  phaseLabel: "1 — Day 1 architecture"
  priority: P0
  profile: core
  launchGate: true
  applicability:
    universal: true
    any: []
    source: >-
      All sites
  task: >-
    Release, backup and rollback architecture
  whatToDo: >-
    Define a deployable recovery target, required backups, recovery owner, cutover window, DNS/CDN dependencies and measurable triggers for availability, indexability and in-scope conversions. For first launch, choose a known-good deployable state or approved holding mode. For an existing site, preserve the prior release and required content/data state. Set recovery-time and acceptable-data-loss targets, including treatment of writes made after cutover.
  doneWhen: >-
    The owner has a usable recovery procedure, required access and recoverable assets/data. The first-launch or existing-site target and timing/data-loss limits are approved. Any holding mode has a defined duration, owner and expected response/indexing behavior. Schedule the timed rehearsal in 4.12; a plan alone is not restoration proof.
  owners: ["operations", "developer"]
  ownerSource: >-
    Developer / operations
  tools: >-
    Hosting platform; backup system; runbook
  cadence:
    triggers: ["before-launch", "on-change"]
    source: >-
      Before launch; test after platform changes
  notes: >-
    Purpose: security/governance. F04. A new site need not invent a previous release. Restoration and controlled holding behavior protect availability and data; they are operational controls. Baseline data limitations are recorded in 4.11. Source: Contingency planning and recovery testing. Source IDs: SRC063.
  automation: attested
  remediationClass: config
  detectors: []
  sources:
    - id: "SRC063"
      topic: "Contingency planning and recovery testing"
      url: "https://csrc.nist.gov/pubs/sp/800/34/r1/upd1/final"
      usedFor: >-
        1.17, 4.12: risk-based recovery planning, targets and exercises. Adapted operational practice; not a universal SEO or legal requirement.
      verified: "2026-09-09"
