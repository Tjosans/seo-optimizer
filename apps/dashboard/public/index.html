<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>SEO Optimizer</title>
<script>
  // The theme choice from Settings, applied before first paint.
  try {
    const theme = localStorage.getItem('seo-theme');
    if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme;
  } catch {}
</script>
<link rel="stylesheet" href="/style.css" />
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <span class="logo" aria-hidden="true">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.5 4a6.5 6.5 0 1 0 0 13a6.5 6.5 0 1 0 0-13"/><path d="m20 20-4.8-4.8"/><path d="m7.8 10.6 2 2 3.6-4"/></svg>
      </span>
      <span class="brand-name">SEO Optimizer</span>
      <span id="version-text" class="ver"></span>
    </div>
    <nav id="nav" class="nav" aria-label="Main"></nav>
    <div class="side-foot">
      <footer id="version-badge" class="update" aria-live="polite" hidden>
        <span id="update-text"></span>
        <div class="bar" id="update-bar" hidden><span></span></div>
        <button id="update-restart" type="button" class="btn small primary" hidden>Update</button>
      </footer>
      <div id="methodology" class="method"></div>
    </div>
  </aside>
  <div class="main">
    <main id="view" class="view" tabindex="-1"></main>
  </div>
</div>
<div id="toasts" class="toasts" aria-live="polite"></div>
<script type="module" src="/app.js"></script>
<script type="module" src="/version.js"></script>
</body>
</html>
