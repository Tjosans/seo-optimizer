- id: "0.6"
  phase: 0
  phaseLabel: "0 — Discovery & strategy"
  priority: P2
  profile: extended
  launchGate: false
  applicability:
    universal: false
    any: ["ai-policy"]
    source: >-
      Sites deciding how their content is used by AI search and training systems
  task: >-
    AI crawler, AI-feature and training policy
  whatToDo: >-
    If the business needs an explicit policy, decide separately for Google Search crawl, index and preview controls; any Search Console generative-AI control shown for an eligible verified property; Google-Extended; OAI-SearchBot; GPTBot; and other currently documented agents. Google describes its UK Search Console control as a test and rollout to a subset of website owners while it engages with the CMA. It is not a universal AI opt-out, does not replace robots or meta directives, and is separate from Google-Extended and third-party crawler controls. Treat search/retrieval and training agents as different controls.
  doneWhen: >-
    The optional policy records each control or agent, purpose, allow/block/limit decision, business reason, affected property or path, evidence, source URL and review date; no control is represented as broader than its documented scope.
  owners: ["business", "seo"]
  ownerSource: >-
    Business + SEO
  tools: >-
    Search Console Settings > Search generative AI; robots.txt; CDN/WAF rules; Sources sheet
  cadence:
    triggers: ["before-launch"]
    interval: quarterly
    source: >-
      Before launch if applicable; review quarterly
  notes: >-
    v4.4: narrowed the UK Search Console wording and separated search controls, Google-Extended and third-party crawlers. llms.txt is optional publisher metadata, not an access-control standard; Google Search says it ignores llms.txt, so using one neither helps nor harms Google Search visibility or rankings. See Sources: Google AI features, Google generative-AI optimization, OpenAI crawlers and OpenAI publisher guidance.
  automation: attested
  remediationClass: config
  detectors: []
  sources:
    - topic: "Google AI features"
      url: "https://developers.google.com/search/docs/appearance/ai-features"
      usedFor: >-
        Googlebot, preview controls, noindex and Google-Extended distinction
      verified: "2026-08-26"
    - topic: "Google generative-AI optimization"
      url: "https://developers.google.com/search/docs/fundamentals/ai-optimization-guide"
      usedFor: >-
        Google Search ignores llms.txt; using it neither helps nor harms Search visibility or rankings
      verified: "2026-08-27"
    - topic: "OpenAI crawlers"
      url: "https://developers.openai.com/api/docs/bots"
