  whatToDo: >-
    Use the 2.11 submodule matrix to test actual selling/catalogue surfaces. Cover representative available, sold-out, retired and variant states; crawl categories/filters under 1.12/1.13/1.15. Verify directly selected variant image/price/availability and correct cart item where sold. Test checkout only when present and feeds only when used. Compare applicable page, markup, feed and transaction totals/currency plus shipping/return policies. Investigate discrepancies against authoritative product data.
