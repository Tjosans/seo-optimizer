- id: "7.6"
  phase: 7
  phaseLabel: "7 — Ongoing"
  priority: P1
  profile: extended
  launchGate: false
  applicability:
    universal: true
    any: []
    source: >-
      All sites
  task: >-
    Off-page link, review and reputation governance
  whatToDo: >-
    Use the 3.13-approved rules before each review programme starts or changes. For Google Maps/Business Profile, forbid incentives, positive-only solicitation/review gating, pressure, demands for specific content or staff names, staff review quotas and benefits for removing/changing negative reviews. Invite honest genuine feedback without influencing it. For other destinations, verify their rules and applicable law before any incentive; require necessary disclosure and no sentiment condition. Prohibit ranking-manipulation link schemes; qualify commercial/UGC links appropriately and monitor material reviews, unlinked mentions, profile/citation accuracy and genuine reputation issues.
  doneWhen: >-
    Record each active destination, policy date, accountable owner, request/moderation workflow and recheck date. Review requests and staff guidance match the approved rules. Markup describes genuine, visible, eligible reviews of the actual item; do not aggregate other sites' ratings. Self-serving LocalBusiness/Organization reviews, including embedded widgets, are ineligible for review stars. Assess Product reviews separately under 2.11/4.6; never relabel business testimonials as product reviews. Material violations trigger pause, correction and renewed approval before resuming.
  owners: ["marketing", "legal", "seo"]
  ownerSource: >-
    Marketing + SEO + legal/compliance
  tools: >-
    Brand monitoring; review platforms; link reports
  cadence:
    triggers: []
    interval: monthly
    source: >-
      Before first programme via 3.13; monthly monitoring; before policy, supplier, incentive or flow changes
  notes: >-
    Purpose: security/governance; legal/accessibility. F02/H03. Google Maps prohibits incentives even with disclosure. Other platforms and legal duties vary; disclosure is not permission. Review-feature eligibility is separate from ordinary reputation management. Sources: Maps review policy; Review snippet guidelines; Spam policies. Source IDs: SRC029; SRC082; SRC083.
  automation: assisted
  remediationClass: content
  detectors: ["offpage-reputation-governance"]
  sources:
    - id: "SRC029"
      topic: "Spam policies"
      url: "https://developers.google.com/search/docs/essentials/spam-policies"
      usedFor: >-
        3.9,3.13: scaled-content, doorway, link-spam and current site-reputation policy; actual third-party arrangements and integration factors, not a blanket ban on contributors.
      verified: "2026-09-09"
    - id: "SRC082"
      topic: "Maps review policy"
      url: "https://support.google.com/contributionpolicy/answer/7400114?hl=en-GB"
      usedFor: >-
        3.13/7.6: genuine reviews; no incentives, positive-only solicitation, pressure, dictated content or staff review quotas. Other destinations require separate policy review.
      verified: "2026-09-09"
    - id: "SRC083"
      topic: "Review snippet guidelines"
      url: "https://developers.google.com/search/docs/appearance/structured-data/review-snippet"
      usedFor: >-
        2.11,3.13,4.6,7.6: visible genuine item-specific reviews; no imported aggregates; self-serving Organization/LocalBusiness star restriction includes widgets and is distinct from eligible Product reviews.
      verified: "2026-09-09"
